<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #18181b; } a:hover { color: #3f3f46; }
    .fr { width: 390px; height: 844px; display: flex; flex-direction: column;
      background: #ffffff; color: #3f3f46; overflow: hidden;
      font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
    .hd { padding: 16px 24px 8px; }
    .wm { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; color: #18181b; }
    .prog { display: flex; gap: 4px; height: 4px; margin: 8px 24px 0; }
    .prog div { flex: 1; background: #ececec; border-radius: 2px; overflow: hidden; }
    .prog i { display: block; height: 100%; background: #18181b; }
    .st { flex: 1; display: flex; flex-direction: column; padding: 8px 24px 24px; min-height: 0; }
    .kk { font-size: 12px; font-weight: 500; line-height: 1.35; letter-spacing: 0.06em;
      text-transform: uppercase; color: #52525b; margin: 16px 0 0; }
    .idrow { display: flex; align-items: center; gap: 12px; padding: 12px 0 16px;
      border-bottom: 1px solid #ececec; margin-top: 8px; }
    .av { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #f4f4f5;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: #18181b; }
    .bn { font-size: 16px; font-weight: 600; color: #18181b; }
    .bu { font-size: 14px; line-height: 1.5; color: #52525b; }
    .link { font-size: 14px; font-weight: 500; color: #52525b;
      text-decoration: underline; text-underline-offset: 3px; }
    .h1 { font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -0.02em;
      color: #18181b; margin: 24px 0 0; }
    .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .opt { display: flex; gap: 16px; align-items: flex-start; padding: 16px;
      background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); }
    .opt.sel { border-color: #18181b; background: #f4f4f5; box-shadow: 0 0 0 1px #18181b; }
    .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d1d5db; margin-top: 2px; }
    .opt.sel .dot { border: 6px solid #18181b; }
    .ot { font-size: 16px; font-weight: 500; color: #18181b; }
    .od { font-size: 14px; line-height: 1.5; color: #52525b; margin-top: 2px; }
    .ft { display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #ececec; padding: 12px 24px 20px; }
    .back { font-size: 16px; font-weight: 500; color: #52525b; }
    .pill { min-height: 48px; padding: 0 32px; display: inline-flex; align-items: center;
      border-radius: 999px; background: #18181b; color: #ffffff;
      font-size: 16px; font-weight: 500; }
    .mk { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid #a1a1aa;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 500; color: #52525b; }
    .rowmk { display: flex; align-items: center; gap: 8px; }
  </style>
</helmet>
<div class="fr">
  <div class="hd"><div class="wm">nuave</div></div>
  <div class="prog">
    <div><i style="width: 33%"></i></div>
    <div><i style="width: 0"></i></div>
    <div><i style="width: 0"></i></div>
    <div><i style="width: 0"></i></div>
  </div>
  <div class="st">
    <p class="kk">Brand dan yang Anda tawarkan</p>

    <div class="rowmk">
      <div class="idrow" style="flex-grow: 1">
        <div class="av">KS</div>
        <div style="flex-grow: 1">
          <div class="bn">Kopi Sudut</div>
          <div class="bu">kopisudut.com</div>
        </div>
        <span class="link">Ganti</span>
      </div>
      <span class="mk">6</span>
    </div>

    <div class="rowmk" style="align-items: flex-start">
      <h1 class="h1" style="flex-grow: 1">Apa yang ingin Anda audit?</h1>
      <span class="mk" style="margin-top: 24px">7</span>
    </div>

    <div class="opts">
      <div class="opt sel">
        <span class="dot"></span>
        <div>
          <div class="ot">Seluruh brand</div>
        </div>
      </div>
      <div class="opt">
        <span class="dot"></span>
        <div>
          <div class="ot">Satu cabang atau lokasi</div>
          <div class="od">Nuave menemukan 3 cabang</div>
        </div>
      </div>
      <div class="opt">
        <span class="dot"></span>
        <div>
          <div class="ot">Satu produk atau layanan</div>
        </div>
      </div>
    </div>
  </div>
  <div class="ft">
    <span class="back">Kembali</span>
    <span class="pill">Lanjut</span>
  </div>
</div>
</x-dc>
</body>
</html>

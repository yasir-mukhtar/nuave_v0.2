<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #18181b; } a:hover { color: #3f3f46; }
    .fr { width: 390px; height: 844px; display: flex; flex-direction: column;
      background: #ffffff; color: #3f3f46; overflow: hidden;
      font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
    .hd { padding: 16px 24px 8px; }
    .wm { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; color: #18181b; }
    .prog { display: flex; gap: 4px; height: 4px; margin: 8px 24px 0; }
    .prog div { flex: 1; background: #ececec; border-radius: 2px; overflow: hidden; }
    .prog i { display: block; height: 100%; background: #18181b; }
    .st { flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 8px 24px 24px; min-height: 0; }
    .h1 { font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -0.02em;
      color: #18181b; margin: 0; }
    .src { font-size: 16px; line-height: 1.5; color: #52525b; margin: 4px 0 0; }
    .steps { display: flex; flex-direction: column; gap: 16px; margin-top: 32px; }
    .step { display: flex; gap: 16px; align-items: center; font-size: 16px; font-weight: 500; }
    .ring { flex: none; width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid #d1d5db; border-top-color: #18181b; }
    .pad { flex: none; width: 24px; }
    .lead { font-size: 16px; line-height: 1.5; color: #3f3f46; margin: 32px 0 0; }
    .mk { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid #a1a1aa;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 500; color: #52525b; }
    .rowmk { display: flex; align-items: flex-start; gap: 8px; }
  </style>
</helmet>
<div class="fr">
  <div class="hd"><div class="wm">nuave</div></div>
  <div class="prog">
    <div><i style="width: 0"></i></div>
    <div><i style="width: 0"></i></div>
    <div><i style="width: 0"></i></div>
    <div><i style="width: 0"></i></div>
  </div>
  <div class="st">
    <div class="rowmk">
      <div style="flex-grow: 1">
        <h1 class="h1">Sebentar, Nuave sedang membaca</h1>
        <p class="src">kopisudut.com</p>
      </div>
      <span class="mk">2</span>
    </div>
    <div class="steps">
      <div class="step" style="color: #18181b">
        <span class="ring"></span>
        <span style="flex-grow: 1">Nama dan identitas brand</span>
        <span class="mk">3</span>
      </div>
      <div class="step" style="color: #a1a1aa">
        <span class="pad"></span>
        <span style="flex-grow: 1">Produk dan lokasi</span>
        <span class="mk">4</span>
      </div>
      <div class="step" style="color: #a1a1aa">
        <span class="pad"></span>
        <span style="flex-grow: 1">Pelanggan dan pembanding</span>
      </div>
    </div>
    <div class="rowmk">
      <p class="lead" style="flex-grow: 1">Semua bisa Anda koreksi.</p>
      <span class="mk" style="margin-top: 32px">5</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

    .void span { font-size: 12px; color: #a1a1aa; letter-spacing: 0.04em; }

    .fab { position: absolute; left: 16px; bottom: 12px; width: 48px; height: 48px;

    .rowmk { display: flex; align-items: center; gap: 8px; }
    .brk { position: absolute; right: -14px; top: 0; bottom: 0; width: 10px;

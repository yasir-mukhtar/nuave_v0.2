name: Fix PR 28 mobile touch target

on:
  push:
    branches:
      - style/tweakcn-intake-preview

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: style/tweakcn-intake-preview

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve mobile touch target policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/audit/tweakcn-intake.css")
          css = path.read_text()
          if "min-height: 2.75rem" in css:
              print("Mobile touch-target rule already present.")
          else:
              marker = "@media (max-width: 720px) {\n"
              rule = '''@media (max-width: 720px) {\n  /* Keep Nuave's established 44px minimum touch target on mobile. */\n  main[data-theme="light"]:has(#identity-scope-heading)\n    [data-slot="button"]:not([aria-label]) {\n    min-height: 2.75rem;\n    height: 2.75rem;\n  }\n\n'''
              if marker not in css:
                  raise SystemExit("Expected mobile media query not found")
              path.write_text(css.replace(marker, rule, 1))
          PY

      - name: Format stylesheet
        run: npx prettier --write src/app/audit/tweakcn-intake.css

      - name: Commit mobile fix when needed
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/audit/tweakcn-intake.css
          git commit -m "fix: preserve intake mobile touch targets"
          git push origin HEAD:style/tweakcn-intake-preview

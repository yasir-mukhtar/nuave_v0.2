name: Apply intake iteration v2

on:
  push:
    branches: [feat/progressive-business-facts]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply requested intake UI simplifications v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/progressive-business-facts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply UI changes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('src/app/audit/AuditWorkflow.tsx')
          s = p.read_text()
          s = s.replace('import { IconCheck, IconDownload } from "@tabler/icons-react";', 'import { IconDownload } from "@tabler/icons-react";')
          s = re.sub(r'\nconst stepLabels = \[\n(?:.*\n)*?\];\n', '\n', s, count=1)
          s = re.sub(r'\n  function backToSource\(\) \{\n(?:.*\n)*?  \}\n\n  function backToFacts', '\n  function backToFacts', s, count=1)
          s = re.sub(r'\n      \{step > 0 && step < 4 \? \(\n        <nav[\s\S]*?      \) : null\}\n', '\n', s, count=1)
          s = s.replace('          onBack={backToSource}\n', '')
          p.write_text(s)

          p = Path('src/app/audit/AuditStages.tsx')
          s = p.read_text()
          s = s.replace('  onBack,\n  onLogo,', '  onLogo,', 1)
          s = s.replace('  onBack: () => void;\n  onLogo:', '  onLogo:', 1)
          s = re.sub(r'\n      <Button\n        type="button"\n        variant="ghost"\n        onClick=\{onBack\}\n        className=\{styles\.backButton\}\n      >\n        <IconArrowLeft /> Ganti website\n      </Button>\n', '\n', s, count=1)
          s = re.sub(r'\n      \{extraction\?\.warnings\.length \? \(\n        <WarningAlert title="Periksa informasi ini">[\s\S]*?      \) : null\}\n', '\n', s, count=1)
          s = s.replace('<div className={`${styles.stickyAction} flex-wrap`}>', '<div className={`${styles.stickyAction} flex-nowrap`}>', 1)
          s = s.replace('<div className="flex w-full items-center justify-between gap-3">', '<div className="flex w-full flex-nowrap items-center gap-3">', 1)
          s = s.replace('variant="ghost"\n                onClick={() => goBack(screen)}\n              >', 'variant="ghost"\n                onClick={() => goBack(screen)}\n                className="min-w-0 flex-1"\n              >', 1)
          s = s.replace('variant="default"\n                onClick={() => navigate("details")}\n              >', 'variant="default"\n                onClick={() => navigate("details")}\n                className="min-w-0 flex-1"\n              >', 1)
          s = s.replace('variant="default"\n                onClick={() => advance(screen)}\n              >', 'variant="default"\n                onClick={() => advance(screen)}\n                className="min-w-0 flex-1"\n              >', 1)
          p.write_text(s)

          p = Path('src/app/audit/audit.module.css')
          s = p.read_text().replace('  position: sticky;\n  top: 0;\n  z-index: 30;\n', '  position: static;\n', 1)
          p.write_text(s)

          p = Path('src/app/audit/tweakcn-intake.css')
          s = p.read_text().rstrip() + '''\n\n/* Progressive intake iteration: flatten Business Facts form sections. */\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-brand-heading),\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-offer-heading),\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-customer-heading),\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-market-heading),\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-similar-heading),\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-details-heading) {\n  margin-bottom: 0;\n  gap: 0;\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n  padding: 0;\n  box-shadow: none;\n}\n\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-brand-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-offer-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-customer-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-market-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-similar-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"]) section:has(> header > #business-facts-details-heading) > header {\n  display: none;\n}\n'''
          p.write_text(s)
          PY
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write src/app/audit/AuditWorkflow.tsx src/app/audit/AuditStages.tsx src/app/audit/audit.module.css src/app/audit/tweakcn-intake.css
      - name: Check formatting, types, and lint
        run: npm run check
      - name: Commit iteration
        run: |
          git config user.name "Yasir Mukhtar"
          git config user.email "yasir.mukhtar@yahoo.com"
          git add -- src/app/audit/AuditWorkflow.tsx src/app/audit/AuditStages.tsx src/app/audit/audit.module.css src/app/audit/tweakcn-intake.css
          git diff --cached --check
          git commit -m "Simplify progressive intake presentation"
          git push origin HEAD:feat/progressive-business-facts

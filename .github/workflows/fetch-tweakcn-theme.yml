name: Fetch Tweakcn Theme

on:
  push:
    branches: [style/tweakcn-intake-preview]

permissions:
  contents: read

jobs:
  fetch-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve shared Tweakcn theme
        env:
          THEME_ID: cmtdoxltw000004kzd4sg8vvl
        run: |
          set -euo pipefail
          for url in \
            "https://tweakcn.com/r/themes/${THEME_ID}.json" \
            "https://tweakcn.com/r/themes/${THEME_ID}"; do
            status="$(curl --silent --show-error --location --output /tmp/theme.json --write-out '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ]; then
              echo "Resolved from: $url"
              echo '---BEGIN-THEME---'
              cat /tmp/theme.json
              echo
              echo '---END-THEME---'
              exit 0
            fi
          done
          echo "Unable to resolve shared Tweakcn theme" >&2
          exit 1

name: Temporary hero formatter diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format landing CSS and print canonical output
        run: |
          npx prettier --write src/styles/landing.css
          printf '%s\n' '---BEGIN_FORMATTED_LANDING_CSS---'
          cat src/styles/landing.css
          printf '%s\n' '---END_FORMATTED_LANDING_CSS---'

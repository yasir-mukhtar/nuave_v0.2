name: Stage current-main sync for similar-businesses

on:
  push:
    branches: [feature/similar-businesses-intake]

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/similar-businesses-intake
          fetch-depth: 0

      - name: Build resolved integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X ours --no-edit origin/main
          python scripts/sync-similar-businesses-main.py
          git checkout origin/main -- .github/workflows/ci.yml .github/workflows/deploy-pages.yml
          git rm scripts/sync-similar-businesses-main.py
          git add src/app/audit/AuditWorkflow.tsx .github/workflows/ci.yml .github/workflows/deploy-pages.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve current main behavior"
          fi
          git push --force origin HEAD:refs/heads/tmp/pr9-sync-result

name: CI

on:
  push:
    branches: [main, feature/similar-businesses-intake]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Export merge-resolution source
        if: github.ref == 'refs/heads/feature/similar-businesses-intake'
        uses: actions/upload-artifact@v4
        with:
          name: similar-businesses-merge-source
          path: |
            src/app/audit/AuditWorkflow.tsx
            src/app/audit/SourceHero.module.css

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-mutating checks
        run: npm run check

      - name: Run unit tests (audit engine + fixture journey)
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Build Cloudflare worker (build-only)
        env:
          NUAVE_PROVIDER: opencodego
          NUAVE_QUESTION_PROVIDER: opencodego
          OPENCODEGO_API_KEY: dummy-build-only-key
          OPENAI_API_KEY: dummy-build-only-key
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          OPENAI_AUDIT_MODEL: gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT: low
        run: |
          trap 'rm -f .env.production.local' EXIT
          cat > .env.production.local <<EOF
          NUAVE_PROVIDER=${NUAVE_PROVIDER}
          NUAVE_QUESTION_PROVIDER=${NUAVE_QUESTION_PROVIDER}
          OPENCODEGO_API_KEY=${OPENCODEGO_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          OPENAI_AUDIT_MODEL=${OPENAI_AUDIT_MODEL}
          OPENAI_AUDIT_REASONING_EFFORT=${OPENAI_AUDIT_REASONING_EFFORT}
          EOF
          npm run build:cf

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run fixture-journey browser tests
        run: npm run test:e2e

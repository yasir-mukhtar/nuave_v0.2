name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Agent C focused question-provider tests
        run: npx vitest run src/lib/audit/questions-id-provider.test.ts src/lib/audit/questions-id-provider-regression.test.ts

      - name: Run non-mutating checks
        run: npm run check

      - name: Run unit tests (audit engine + fixture journey)
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run fixture-journey browser tests
        run: npm run test:e2e

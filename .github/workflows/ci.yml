name: Sync latest main into similar-businesses feature

on:
  push:
    branches: [feature/similar-businesses-intake]

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/similar-businesses-intake
          fetch-depth: 0

      - name: Merge reviewed main tip and clean temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X ours --no-edit 9591c7ac39c6c51f92c1368cedfeb7c041c3ce25
          python scripts/sync-similar-businesses-main.py
          git checkout 786e6e29fd4c717cf14e3087b9b0e913d63e5033 -- .github/workflows/ci.yml
          git rm scripts/sync-similar-businesses-main.py
          git add src/app/audit/AuditWorkflow.tsx .github/workflows/ci.yml
          git commit -m "chore: preserve latest main UI fixes"
          git push origin HEAD:feature/similar-businesses-intake

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-mutating checks
        run: npm run check

      - name: Run unit tests (audit engine + fixture journey)
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Build Cloudflare worker (build-only)
        env:
          NUAVE_PROVIDER: opencodego
          NUAVE_QUESTION_PROVIDER: opencodego
          OPENCODEGO_API_KEY: dummy-build-only-key
          OPENAI_API_KEY: dummy-build-only-key
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          OPENAI_AUDIT_MODEL: gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT: low
        run: |
          trap 'rm -f .env.production.local' EXIT
          cat > .env.production.local <<EOF
          NUAVE_PROVIDER=${NUAVE_PROVIDER}
          NUAVE_QUESTION_PROVIDER=${NUAVE_QUESTION_PROVIDER}
          OPENCODEGO_API_KEY=${OPENCODEGO_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          OPENAI_AUDIT_MODEL=${OPENAI_AUDIT_MODEL}
          OPENAI_AUDIT_REASONING_EFFORT=${OPENAI_AUDIT_REASONING_EFFORT}
          EOF
          npm run build:cf

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run fixture-journey browser tests
        run: npm run test:e2e

  verify-main-origin:
    name: Verify main came from merged PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject direct pushes to main from deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          merged_pr_number=""

          for attempt in 1 2 3 4 5 6; do
            associated_pr=""
            recent_pr=""

            if ! associated_pr="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GH_REPO}/commits/${COMMIT_SHA}/pulls" \
                --jq 'map(select(.merged_at != null and .base.ref == "main")) | first | .number // empty'
            )"; then
              echo "Commit-to-PR lookup failed on attempt ${attempt}/6; retrying before blocking deployment."
            fi

            if [ -n "${associated_pr}" ]; then
              merged_pr_number="${associated_pr}"
              break
            fi

            if ! recent_pr="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GH_REPO}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" \
                --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"${COMMIT_SHA}\") | .number" \
                | head -n 1
            )"; then
              echo "Recent merged-PR lookup failed on attempt ${attempt}/6; retrying before blocking deployment."
            fi

            if [ -n "${recent_pr}" ]; then
              merged_pr_number="${recent_pr}"
              break
            fi

            if [ "${attempt}" -lt 6 ]; then
              echo "No merged PR association visible yet for ${COMMIT_SHA} (attempt ${attempt}/6); retrying in 5 seconds."
              sleep 5
            fi
          done

          if [ -z "${merged_pr_number}" ]; then
            echo "::error::Deployment blocked: ${COMMIT_SHA} reached main without a merged PR association after 6 checks."
            exit 1
          fi

          echo "Main commit ${COMMIT_SHA} is associated with merged PR #${merged_pr_number}."

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [validate, verify-main-origin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare production build env
        run: |
          cat > .env.production.local <<'EOF'
          NUAVE_PROVIDER=opencodego
          NUAVE_QUESTION_PROVIDER=opencodego
          OPENCODEGO_API_KEY=${{ secrets.OPENCODEGO_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENCODEGO_API_KEY }}
          OPENAI_BASE_URL=https://opencode.ai/zen/go/v1
          OPENAI_AUDIT_MODEL=gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT=low
          NUAVE_FIXTURE_PREVIEW_ENABLED=${{ secrets.NUAVE_FIXTURE_PREVIEW_ENABLED }}
          NUAVE_FIXTURE_FORCE_REPORT_FAILURE=${{ secrets.NUAVE_FIXTURE_FORCE_REPORT_FAILURE }}
          OPENAI_AUDIT_CARRYOVER_COST_USD=${{ secrets.OPENAI_AUDIT_CARRYOVER_COST_USD }}
          EOF

      - name: Build validated OpenNext worker
        run: npm run build:cf

      - name: Deploy validated commit to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .

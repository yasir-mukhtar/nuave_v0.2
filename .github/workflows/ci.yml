name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-mutating checks
        run: npm run check

      - name: Run unit tests (audit engine + fixture journey)
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Build Cloudflare worker (build-only)
        env:
          NUAVE_PROVIDER: openai
          NUAVE_QUESTION_PROVIDER: openai
          OPENAI_API_KEY: dummy-build-only-key
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENAI_AUDIT_MODEL: gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT: low
        run: |
          trap 'rm -f .env.production.local' EXIT
          cat > .env.production.local <<EOF
          NUAVE_PROVIDER=${NUAVE_PROVIDER}
          NUAVE_QUESTION_PROVIDER=${NUAVE_QUESTION_PROVIDER}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          OPENAI_AUDIT_MODEL=${OPENAI_AUDIT_MODEL}
          OPENAI_AUDIT_REASONING_EFFORT=${OPENAI_AUDIT_REASONING_EFFORT}
          EOF
          npm run build:cf

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  verify-main-origin:
    name: Verify main came from merged PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject direct pushes to main from deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          merged_pr_number=""

          for attempt in 1 2 3 4 5 6; do
            associated_pr=""
            recent_pr=""

            if ! associated_pr="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GH_REPO}/commits/${COMMIT_SHA}/pulls" \
                --jq 'map(select(.merged_at != null and .base.ref == "main")) | first | .number // empty'
            )"; then
              echo "Commit-to-PR lookup failed on attempt ${attempt}/6; retrying before blocking deployment."
            fi

            if [ -n "${associated_pr}" ]; then
              merged_pr_number="${associated_pr}"
              break
            fi

            if ! recent_pr="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GH_REPO}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" \
                --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"${COMMIT_SHA}\") | .number" \
                | head -n 1
            )"; then
              echo "Recent merged-PR lookup failed on attempt ${attempt}/6; retrying before blocking deployment."
            fi

            if [ -n "${recent_pr}" ]; then
              merged_pr_number="${recent_pr}"
              break
            fi

            if [ "${attempt}" -lt 6 ]; then
              echo "No merged PR association visible yet for ${COMMIT_SHA} (attempt ${attempt}/6); retrying in 5 seconds."
              sleep 5
            fi
          done

          if [ -z "${merged_pr_number}" ]; then
            echo "::error::Deployment blocked: ${COMMIT_SHA} reached main without a merged PR association after 6 checks."
            exit 1
          fi

          echo "Main commit ${COMMIT_SHA} is associated with merged PR #${merged_pr_number}."

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [validate, verify-main-origin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Spec 019: NEXT_PUBLIC_META_PIXEL_ID is Nuave's Meta Pixel (public: it
      # appears in the page). It turns on the cookie notice; the Pixel itself
      # loads only after a visitor taps Setuju. Blank it to switch both off.
      - name: Prepare production build env
        run: |
          cat > .env.production.local <<'EOF'
          NUAVE_PROVIDER=openai
          NUAVE_QUESTION_PROVIDER=openai
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=https://api.openai.com/v1
          OPENAI_AUDIT_MODEL=gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT=low
          NUAVE_NEW_AUDIT_ENABLED=true
          NUAVE_AUDIT_MODE=live
          CHEAPERINFERENCE_API_KEY=${{ secrets.CHEAPERINFERENCE_API_KEY }}
          NEXT_PUBLIC_META_PIXEL_ID=890453577390181
          EOF

      - name: Build validated OpenNext worker
        run: npm run build:cf

      # Spec 016 R-13: the database changes come first. Migrations only add
      # tables and columns that are nullable or have defaults, so the old worker
      # keeps running between this step and the deploy. The API token needs D1
      # edit permission (founder action Q5).
      - name: Apply D1 migrations (production database)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply SPEND_DB --remote
          workingDirectory: .

      # Spec 016 R-15: the cron cannot see build-time values, so the deploy also
      # sets everything the cron needs as Worker secrets (the same ones a web
      # request sees): mode, emergency switch, caps, the founder's email list, the
      # Resend key and from address, and the keys the live mode needs. The API
      # token needs Worker secret permission (founder action Q5). A value that is
      # empty here fails the deploy rather than leaving the Worker without it.
      - name: Deploy validated commit to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          NUAVE_NEW_AUDIT_ENABLED: "true"
          NUAVE_AUDIT_MODE: live
          NUAVE_DAILY_SPEND_LIMIT_USD: "5"
          NUAVE_ORDER_SPEND_LIMIT_USD: "2"
          NUAVE_ORDER_EMAIL_ALLOWLIST: ${{ secrets.NUAVE_ORDER_EMAIL_ALLOWLIST }}
          # Spec 016 R-25: the real mail sender (Resend). The cron and the order
          # route both refuse live work when either is missing.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NUAVE_MAIL_FROM: ${{ secrets.NUAVE_MAIL_FROM }}
          # Spec 017 R-17: Midtrans sandbox (the production switch stays false
          # until G1), the founder test-pass code (at least 24 characters) and
          # the founder's alert address. Without the key and the alert address no
          # payment and no test pass start (fail closed). Preview workers get
          # none of these.
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_IS_PRODUCTION: "false"
          NUAVE_TEST_PASS_CODE: ${{ secrets.NUAVE_TEST_PASS_CODE }}
          NUAVE_FOUNDER_ALERT_EMAIL: ${{ secrets.NUAVE_FOUNDER_ALERT_EMAIL }}
          NUAVE_PROVIDER: openai
          NUAVE_QUESTION_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENAI_AUDIT_MODEL: gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT: low
          CHEAPERINFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
          # Spec 018 R-26: DataForSEO (search discovery, and in PR 2 the ChatGPT
          # and Google AI Overview checks). Preview workers get none.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .
          secrets: |
            NUAVE_NEW_AUDIT_ENABLED
            NUAVE_AUDIT_MODE
            NUAVE_DAILY_SPEND_LIMIT_USD
            NUAVE_ORDER_SPEND_LIMIT_USD
            NUAVE_ORDER_EMAIL_ALLOWLIST
            RESEND_API_KEY
            NUAVE_MAIL_FROM
            MIDTRANS_SERVER_KEY
            MIDTRANS_IS_PRODUCTION
            NUAVE_TEST_PASS_CODE
            NUAVE_FOUNDER_ALERT_EMAIL
            NUAVE_PROVIDER
            NUAVE_QUESTION_PROVIDER
            OPENAI_API_KEY
            OPENAI_BASE_URL
            OPENAI_AUDIT_MODEL
            OPENAI_AUDIT_REASONING_EFFORT
            CHEAPERINFERENCE_API_KEY
            DATAFORSEO_LOGIN
            DATAFORSEO_PASSWORD

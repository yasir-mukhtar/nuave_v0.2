name: CI

on:
  push:
    branches: [feature/similar-businesses-intake]

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/similar-businesses-intake
          fetch-depth: 0

      - name: Merge latest main and preserve feature semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if ! grep -qx 'src/app/audit/AuditWorkflow.tsx' <<<"$conflicts"; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi

            git checkout --ours src/app/audit/AuditWorkflow.tsx
            python - <<'PY'
          from pathlib import Path

          path = Path("src/app/audit/AuditWorkflow.tsx")
          text = path.read_text()
          replacements = [
              (
                  '''import {
            AUDIT_STAGE_CALL_LIMITS,
            summarizeAuditTelemetry,
          } from "@/lib/audit/telemetry";''',
                  '''import { AUDIT_STAGE_CALL_LIMITS } from "@/lib/audit/telemetry";''',
              ),
              (
                  '''  const telemetrySummary =
            report?.operational_telemetry ??
            summarizeAuditTelemetry(
              [
                ...setupTelemetry,
                ...observations.flatMap((observation) => observation.telemetry || []),
              ],
              AUDIT_COST_LIMIT_USD,
              carryoverCostUsd,
            );
          ''',
                  '',
              ),
              (
                  '''      {error ? (
                <div className={`${styles.globalAlert} ${styles.noPrint}`}>''',
                  '''      {error && step > 0 ? (
                <div className={`${styles.globalAlert} ${styles.noPrint}`}>''',
              ),
              (
                  '''      {telemetrySummary.call_count || telemetrySummary.carryover_cost_usd ? (
                <div className={`${styles.globalAlert} ${styles.noPrint}`}>
                  <Alert status="default">
                    <Alert.Indicator />
                    <Alert.Content>
                      <Alert.Title>Kendali biaya sesi privat</Alert.Title>
                      <Alert.Description>
                        {telemetrySummary.call_count} panggilan API · USD{" "}
                        {telemetrySummary.accounted_cost_usd.toFixed(4)} tercatat dari
                        USD {telemetrySummary.cost_limit_usd.toFixed(2)}
                        {` · sisa USD ${Math.max(
                          0,
                          telemetrySummary.cost_limit_usd -
                            telemetrySummary.accounted_cost_usd,
                        ).toFixed(4)}`}
                        {telemetrySummary.carryover_cost_usd
                          ? ` · USD ${telemetrySummary.carryover_cost_usd.toFixed(4)} dibawa dari sesi sebelumnya`
                          : ""}
                      </Alert.Description>
                    </Alert.Content>
                  </Alert>
                </div>
              ) : null}
          ''',
                  '',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one semantic merge target, found {count}: {old[:60]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
            git add src/app/audit/AuditWorkflow.tsx
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts remain:"
            printf '%s\n' "$unresolved"
            exit 1
          fi

          # Restore the durable CI workflow from the last clean feature head.
          git checkout 786e6e29fd4c717cf14e3087b9b0e913d63e5033 -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml

          git commit -m "merge: sync latest main into similar-businesses feature"
          git push origin HEAD:feature/similar-businesses-intake

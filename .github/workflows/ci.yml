name: CI

on:
  pull_request:
    # ready_for_review: a draft runs only the quick checks, so the full set
    # runs again when it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # To fit the monthly GitHub Actions minutes, a PR runs only what it needs:
  # - always: code checks and unit tests (the unit tests also read some docs);
  # - not on a draft and not when only docs changed: the build and the
  #   browser tests;
  # - the Meta Pixel browser suite only when a file it depends on changed.
  # `main` is not tested again after a merge: the PR was tested, so `main`
  # only checks the merge and deploys.
  changes:
    name: What changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      browser-matrix: ${{ steps.scope.outputs.browser-matrix }}
    steps:
      - name: Decide which checks this PR needs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          # Every file the PR changes, with the old name of a moved file.
          files="$(
            gh api --paginate "/repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)'
          )"

          code=false
          if printf '%s\n' "${files}" | grep -Ev '^docs/|\.md$' | grep -q .; then
            code=true
          fi

          # The files the Meta Pixel suite depends on: the consent notice, the
          # Pixel and Conversions API code, the screens that send its events,
          # the suite itself and the dependencies.
          pixel=false
          if printf '%s\n' "${files}" | grep -Eq '^(src/lib/consent/|src/components/consent/|src/lib/meta/|src/app/api/meta/|src/app/layout\.tsx|src/app/privacy/|src/components/Footer\.tsx|src/components/landing/SiteFooter\.tsx|src/lib/bottom-bars\.ts|src/lib/intake/SmartIntakeJourney\.tsx|src/lib/intake/order-screens\.tsx|src/lib/payments/|tests/e2e/(meta-pixel\.spec|shared-config|helpers|journey)\.ts|playwright\.config\.pixel\.ts|next\.config\.ts|package(-lock)?\.json)'; then
            pixel=true
          fi

          full=false
          if [ "${IS_DRAFT}" != "true" ] && [ "${code}" = "true" ]; then
            full=true
          fi

          # The enabled suite holds most of the tests, so it is split by test
          # into four parts that run on separate machines. The tests do not
          # depend on running in order, so --fully-parallel lets Playwright
          # split inside a file, not only between files.
          matrix='[{"name":"enabled 1/4","suite":"enabled","args":"--fully-parallel --shard=1/4"}'
          matrix+=',{"name":"enabled 2/4","suite":"enabled","args":"--fully-parallel --shard=2/4"}'
          matrix+=',{"name":"enabled 3/4","suite":"enabled","args":"--fully-parallel --shard=3/4"}'
          matrix+=',{"name":"enabled 4/4","suite":"enabled","args":"--fully-parallel --shard=4/4"}'
          matrix+=',{"name":"disabled","suite":"disabled","args":""}'
          if [ "${pixel}" = "true" ]; then
            matrix+=',{"name":"pixel","suite":"pixel","args":""}'
          fi
          matrix+=']'

          echo "Draft: ${IS_DRAFT}. Changes code: ${code}. Changes Meta Pixel files: ${pixel}. Full run: ${full}."
          {
            echo "full=${full}"
            echo "browser-matrix=${matrix}"
          } >> "${GITHUB_OUTPUT}"

  # The checks run as separate jobs at the same time, so a run takes about as
  # long as the slowest one instead of all of them added together. `validate`
  # at the bottom stays the single required check and passes only when every
  # check this PR needs passed.
  checks:
    name: Code checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-mutating checks
        run: npm run check

  unit-tests:
    name: Unit tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (audit engine + fixture journey)
        run: npm run test:unit

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build:cf runs `npm run build` (the Next.js build) itself before
      # packaging the worker, so one step covers both builds.
      - name: Build application and Cloudflare worker (build-only)
        env:
          NUAVE_PROVIDER: openai
          NUAVE_QUESTION_PROVIDER: openai
          OPENAI_API_KEY: dummy-build-only-key
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENAI_AUDIT_MODEL: gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT: low
        run: |
          trap 'rm -f .env.production.local' EXIT
          cat > .env.production.local <<EOF
          NUAVE_PROVIDER=${NUAVE_PROVIDER}
          NUAVE_QUESTION_PROVIDER=${NUAVE_QUESTION_PROVIDER}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          OPENAI_AUDIT_MODEL=${OPENAI_AUDIT_MODEL}
          OPENAI_AUDIT_REASONING_EFFORT=${OPENAI_AUDIT_REASONING_EFFORT}
          EOF
          npm run build:cf

  browser-tests:
    name: Browser tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The list of suites comes from the `changes` job above.
        include: ${{ fromJSON(needs.changes.outputs.browser-matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The downloaded browser is kept between runs and only fetched again
      # when the lockfile (and so the Playwright version) changes.
      - name: Restore Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Skips the download when the restored browser is already there, and
      # always installs the system packages the browser needs.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:${{ matrix.suite }} -- ${{ matrix.args }}

      # Keeps the screenshot and trace of a failed test, so a failure that
      # does not happen again locally can still be explained.
      - name: Save failed-test screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  validate:
    name: validate
    if: always() && github.event_name == 'pull_request'
    needs: [changes, checks, unit-tests, build, browser-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check this PR needs to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BUILD: ${{ needs.build.result }}
          BROWSER_TESTS: ${{ needs.browser-tests.result }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          echo "What changed: ${CHANGES}. Code checks: ${CHECKS}. Unit tests: ${UNIT_TESTS}. Build: ${BUILD}. Browser tests: ${BROWSER_TESTS}. Full run: ${FULL}."
          failed=0
          for result in "${CHANGES}" "${CHECKS}" "${UNIT_TESTS}"; do
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          # The build and the browser tests may be skipped only when this PR
          # did not need them (a draft, or only docs changed).
          for result in "${BUILD}" "${BROWSER_TESTS}"; do
            if [ "${result}" = "success" ]; then
              continue
            fi
            if [ "${result}" = "skipped" ] && [ "${FULL}" != "true" ]; then
              continue
            fi
            failed=1
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::At least one check did not pass."
            exit 1
          fi
          if [ "${FULL}" != "true" ]; then
            echo "::notice::Draft or docs-only change: the build and browser tests were skipped. They run when the PR is marked ready and changes code."
          fi

  verify-main-origin:
    name: Verify main came from merged PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject direct pushes to main from deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          merged_pr_number=""

          for attempt in 1 2 3 4 5 6; do
            associated_pr=""
            recent_pr=""

            if ! associated_pr="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GH_REPO}/commits/${COMMIT_SHA}/pulls" \
                --jq 'map(select(.merged_at != null and .base.ref == "main")) | first | .number // empty'
            )"; then
              echo "Commit-to-PR lookup failed on attempt ${attempt}/6; retrying before blocking deployment."
            fi

            if [ -n "${associated_pr}" ]; then
              merged_pr_number="${associated_pr}"
              break
            fi

            if ! recent_pr="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GH_REPO}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" \
                --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"${COMMIT_SHA}\") | .number" \
                | head -n 1
            )"; then
              echo "Recent merged-PR lookup failed on attempt ${attempt}/6; retrying before blocking deployment."
            fi

            if [ -n "${recent_pr}" ]; then
              merged_pr_number="${recent_pr}"
              break
            fi

            if [ "${attempt}" -lt 6 ]; then
              echo "No merged PR association visible yet for ${COMMIT_SHA} (attempt ${attempt}/6); retrying in 5 seconds."
              sleep 5
            fi
          done

          if [ -z "${merged_pr_number}" ]; then
            echo "::error::Deployment blocked: ${COMMIT_SHA} reached main without a merged PR association after 6 checks."
            exit 1
          fi

          echo "Main commit ${COMMIT_SHA} is associated with merged PR #${merged_pr_number}."

  deploy:
    name: Deploy to Cloudflare Workers
    # The merged PR was tested; the deploy builds the commit again below.
    needs: verify-main-origin
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Spec 019: NEXT_PUBLIC_META_PIXEL_ID is Nuave's Meta Pixel (public: it
      # appears in the page). It turns on the cookie notice; the Pixel itself
      # loads only after a visitor taps Setuju. Blank it to switch both off.
      - name: Prepare production build env
        run: |
          cat > .env.production.local <<'EOF'
          NUAVE_PROVIDER=openai
          NUAVE_QUESTION_PROVIDER=openai
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=https://api.openai.com/v1
          OPENAI_AUDIT_MODEL=gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT=low
          NUAVE_NEW_AUDIT_ENABLED=true
          NUAVE_AUDIT_MODE=live
          CHEAPERINFERENCE_API_KEY=${{ secrets.CHEAPERINFERENCE_API_KEY }}
          NEXT_PUBLIC_META_PIXEL_ID=890453577390181
          EOF

      - name: Build validated OpenNext worker
        run: npm run build:cf

      # Spec 016 R-13: the database changes come first. Migrations only add
      # tables and columns that are nullable or have defaults, so the old worker
      # keeps running between this step and the deploy. The API token needs D1
      # edit permission (founder action Q5).
      - name: Apply D1 migrations (production database)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply SPEND_DB --remote
          workingDirectory: .

      # Spec 016 R-15: the cron cannot see build-time values, so the deploy also
      # sets everything the cron needs as Worker secrets (the same ones a web
      # request sees): mode, emergency switch, caps, the founder's email list, the
      # Resend key and from address, and the keys the live mode needs. The API
      # token needs Worker secret permission (founder action Q5). A value that is
      # empty here fails the deploy rather than leaving the Worker without it.
      - name: Deploy validated commit to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          NUAVE_NEW_AUDIT_ENABLED: "true"
          NUAVE_AUDIT_MODE: live
          # Founder, 2026-10-28 (Spec 021 PR 6b): USD 50 a day, USD 5.00 an
          # order, so three Claude report calls always fit an order's hold.
          NUAVE_DAILY_SPEND_LIMIT_USD: "50"
          NUAVE_ORDER_SPEND_LIMIT_USD: "5"
          NUAVE_ORDER_EMAIL_ALLOWLIST: ${{ secrets.NUAVE_ORDER_EMAIL_ALLOWLIST }}
          # Spec 016 R-25: the real mail sender (Resend). The cron and the order
          # route both refuse live work when either is missing.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NUAVE_MAIL_FROM: ${{ secrets.NUAVE_MAIL_FROM }}
          # Spec 017 R-17: Midtrans sandbox (the production switch stays false
          # until G1), the founder test-pass code (at least 24 characters) and
          # the founder's alert address. Without the key and the alert address no
          # payment and no test pass start (fail closed). Preview workers get
          # none of these.
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_IS_PRODUCTION: "false"
          NUAVE_TEST_PASS_CODE: ${{ secrets.NUAVE_TEST_PASS_CODE }}
          NUAVE_FOUNDER_ALERT_EMAIL: ${{ secrets.NUAVE_FOUNDER_ALERT_EMAIL }}
          NUAVE_PROVIDER: openai
          NUAVE_QUESTION_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENAI_AUDIT_MODEL: gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT: low
          CHEAPERINFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
          # Spec 018 R-26: DataForSEO (search discovery, and in PR 2 the ChatGPT
          # and Google AI Overview checks). Preview workers get none.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # Spec 022 R-16: the Meta Conversions API token for the server
          # Purchase event. Preview workers get none, so they send nothing.
          # The founder makes it in Meta Events Manager before this merges.
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
          # Spec 021 PR 6b: every live two-source report is written by Claude
          # Opus 5.5 (claude-sonnet-5-5 is the cheaper writer), with the pages
          # Firecrawl read for the order. The founder adds the three keys to
          # the GitHub secrets before this merges; preview workers get none.
          NUAVE_REPORT_WRITER: claude-opus-5-5
          NUAVE_ANTHROPIC_API_KEY: ${{ secrets.NUAVE_ANTHROPIC_API_KEY }}
          NUAVE_ANTHROPIC_WORKSPACE_ID: ${{ secrets.NUAVE_ANTHROPIC_WORKSPACE_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .
          secrets: |
            NUAVE_NEW_AUDIT_ENABLED
            NUAVE_AUDIT_MODE
            NUAVE_DAILY_SPEND_LIMIT_USD
            NUAVE_ORDER_SPEND_LIMIT_USD
            NUAVE_ORDER_EMAIL_ALLOWLIST
            RESEND_API_KEY
            NUAVE_MAIL_FROM
            MIDTRANS_SERVER_KEY
            MIDTRANS_IS_PRODUCTION
            NUAVE_TEST_PASS_CODE
            NUAVE_FOUNDER_ALERT_EMAIL
            NUAVE_PROVIDER
            NUAVE_QUESTION_PROVIDER
            OPENAI_API_KEY
            OPENAI_BASE_URL
            OPENAI_AUDIT_MODEL
            OPENAI_AUDIT_REASONING_EFFORT
            CHEAPERINFERENCE_API_KEY
            DATAFORSEO_LOGIN
            DATAFORSEO_PASSWORD
            META_CAPI_ACCESS_TOKEN
            NUAVE_REPORT_WRITER
            NUAVE_ANTHROPIC_API_KEY
            NUAVE_ANTHROPIC_WORKSPACE_ID
            FIRECRAWL_API_KEY

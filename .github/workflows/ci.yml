name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: spec-003-finish-live-quality-gate

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact Prettier output
        run: |
          npx prettier --write \
            src/app/audit/AuditWorkflow.tsx \
            src/lib/audit/variance-workflow.test.ts

          if git diff --quiet -- \
            src/app/audit/AuditWorkflow.tsx \
            src/lib/audit/variance-workflow.test.ts; then
            echo "Exact formatter output already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/app/audit/AuditWorkflow.tsx \
            src/lib/audit/variance-workflow.test.ts
          git commit -m "style: apply exact Prettier output"
          git push origin HEAD:spec-003-finish-live-quality-gate

      - name: Stop after formatter handoff
        run: echo "Exact formatter output is on the branch; normal CI will be restored separately."

name: DataForSEO test

# One-off experiment (experiments/dataforseo-sozo). Runs only when the plan
# file changes on the test branch, then commits the saved results back.
on:
  push:
    branches: [claude/laughing-fermi-prsgqf]
    paths: [experiments/dataforseo-sozo/plan.json]

permissions:
  contents: write

concurrency:
  group: dataforseo-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the planned stage
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node experiments/dataforseo-sozo/run.mjs "$(node -p "require('./experiments/dataforseo-sozo/plan.json').stage")"

      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add experiments/dataforseo-sozo/results
          git diff --cached --quiet || git commit -m "DataForSEO test results"
          git push

name: Format PR 28 intake CSS

on:
  push:
    branches:
      - style/tweakcn-intake-preview
    paths:
      - src/app/audit/tweakcn-intake.css
      - src/app/audit/beui-focus.css

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: style/tweakcn-intake-preview

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format intake styles
        run: npx prettier --write src/app/audit/tweakcn-intake.css src/app/audit/beui-focus.css

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/audit/tweakcn-intake.css src/app/audit/beui-focus.css
          git commit -m "style: format intake theme CSS"
          git push origin HEAD:style/tweakcn-intake-preview

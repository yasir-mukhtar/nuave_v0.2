name: Preview low fidelity intake prototype

on:
  push:
    branches:
      - design/airbnb-intake-prototype

permissions:
  contents: write

jobs:
  preview:
    if: github.event.head_commit.message == 'Fix and preview low fidelity intake prototype'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/airbnb-intake-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix prototype navigation and format
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/app/audit/intake-prototype/page.tsx')
          s = p.read_text()
          s = s.replace('import { useMemo, useState } from "react";\n', 'import Link from "next/link";\nimport { useMemo, useState } from "react";\n', 1)
          s = s.replace('<a href="/" className={styles.brandMark}>Nuave</a>', '<Link href="/" className={styles.brandMark}>Nuave</Link>', 1)
          p.write_text(s)
          PY
          npx prettier --write src/app/audit/intake-prototype/page.tsx src/app/audit/intake-prototype/prototype.module.css
      - name: Commit prototype fixes
        run: |
          git config user.name "Yasir Mukhtar"
          git config user.email "yasir.mukhtar@yahoo.com"
          git add -- src/app/audit/intake-prototype/page.tsx src/app/audit/intake-prototype/prototype.module.css
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Polish low fidelity intake prototype"
            git push origin HEAD:design/airbnb-intake-prototype
          fi
      - name: Check repository
        run: npm run check
      - name: Build and upload branch preview
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare upload --preview-alias intake-airbnb

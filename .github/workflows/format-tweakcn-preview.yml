name: Format Tweakcn Preview

on:
  push:
    branches: [style/tweakcn-intake-preview]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/tweakcn-intake-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/audit/layout.tsx src/app/audit/tweakcn-intake.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/audit/layout.tsx src/app/audit/tweakcn-intake.css
          git commit -m "Format Tweakcn intake preview"
          git push origin HEAD:style/tweakcn-intake-preview

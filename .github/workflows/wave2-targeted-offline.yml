name: Wave 2 targeted offline verification

on:
  push:
    branches:
      - fix/wave2-subsystem-consumers-2026-08-23

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    env:
      NUAVE_PROVIDER: opencodego
      NUAVE_QUESTION_PROVIDER: opencodego
      NUAVE_LIVE_PROVIDER_TESTING: "0"
      OPENCODEGO_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply narrow certification corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          Path("vitest.config.ts").write_text('''import { resolve } from "node:path";\nimport { defineConfig } from "vitest/config";\n\nexport default defineConfig({\n  resolve: {\n    alias: {\n      "@": resolve(process.cwd(), "src"),\n    },\n  },\n  test: {\n    include: [\n      "src/**/*.{test,spec}.{ts,tsx}",\n      "tests/**/*.test.{ts,tsx,mjs}",\n    ],\n    exclude: [\n      "**/node_modules/**",\n      "**/.git/**",\n      "**/.next/**",\n      "scripts/**",\n    ],\n  },\n});\n''')

          report_path = Path("src/lib/audit/report-pipeline.test.ts")
          report = report_path.read_text()
          if "function protectedReportContent()" not in report:
              report = report.replace("goldenReportContent()", "protectedReportContent()")
              marker = "function result(content: ReportContent, id: string) {"
              helper = '''function protectedReportContent(): ReportContent {\n  const content = goldenReportContent();\n  return {\n    ...content,\n    details: content.details.map((detail, index) => ({\n      ...detail,\n      answer_excerpt: goldenCompletedObservations[index].raw_answer,\n    })),\n  };\n}\n\n'''
              if marker not in report:
                  raise SystemExit("report helper insertion marker missing")
              report = report.replace(marker, helper + marker, 1)
          report = report.replace(
              '      answer_excerpt: "A paraphrase that is not retained evidence.",\n',
              '',
          )
          report_path.write_text(report)

          suggestion_path = Path("src/lib/audit/question-suggestion-wave2.test.ts")
          suggestion = suggestion_path.read_text()
          suggestion = suggestion.replace(
              'it("falls back before display when model output breaks the default composition and records truthful provenance", async () => {',
              'it("repairs the unsafe slot before display and records truthful provenance", async () => {',
          )
          old = '''    expect(result.generation.source).toBe("fallback");\n    expect(result.generation.warnings).toContain(\n      "default_composition_not_five_five",\n    );'''
          new = '''    expect(result.generation.source).toBe("model");\n    expect(result.generation.warnings).toContain("slot_safety_repair:1");'''
          if old not in suggestion:
              raise SystemExit("question provenance assertion marker missing")
          suggestion = suggestion.replace(old, new, 1)
          suggestion_path.write_text(suggestion)
          PY
          npx prettier --write vitest.config.ts src/lib/audit/report-pipeline.test.ts src/lib/audit/question-suggestion-wave2.test.ts
          git diff --check

      - name: Prove default Vitest discovery excludes scripts
        run: |
          npx vitest list | tee vitest-list.txt
          if grep -E '(^|/)scripts/' vitest-list.txt; then
            echo "Live/script test leaked into default Vitest discovery"
            exit 1
          fi

      - name: Run targeted Wave 2 Vitest coverage
        run: |
          npx vitest run \
            src/lib/audit/source-input.test.ts \
            src/lib/audit/website-input.test.ts \
            src/lib/audit/similar-businesses-wave2.test.ts \
            src/lib/audit/question-suggestion-wave2.test.ts \
            src/lib/audit/wave2-integration-wiring.test.ts \
            src/lib/audit/customer-error.test.ts \
            src/lib/audit/customer-evidence-export.test.ts \
            src/lib/audit/report-excerpt.test.ts \
            src/lib/audit/report-pipeline.test.ts \
            src/lib/public-truth-wave2.test.ts \
            src/lib/audit/wave2-route-contract.test.ts \
            tests/e2e/network-guard.test.ts \
            tests/e2e/shared-config.test.ts \
            tests/verify-offline.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Spec 004/offline external-host browser guard
        run: npx playwright test tests/e2e/offline-network.spec.ts

      - name: Commit verified corrections and remove helper
        run: |
          git rm -- .github/workflows/wave2-targeted-offline.yml
          git add -- \
            vitest.config.ts \
            src/lib/audit/report-pipeline.test.ts \
            src/lib/audit/question-suggestion-wave2.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(wave2): align offline discovery and protected fixtures"
          git push origin HEAD:fix/wave2-subsystem-consumers-2026-08-23

name: Wave 2 targeted offline verification

on:
  push:
    branches:
      - fix/wave2-subsystem-consumers-2026-08-23

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    env:
      NUAVE_PROVIDER: opencodego
      NUAVE_QUESTION_PROVIDER: opencodego
      NUAVE_LIVE_PROVIDER_TESTING: "0"
      OPENCODEGO_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove default Vitest discovery excludes scripts
        run: |
          npx vitest list | tee vitest-list.txt
          if grep -E '(^|/)scripts/' vitest-list.txt; then
            echo "Live/script test leaked into default Vitest discovery"
            exit 1
          fi

      - name: Run targeted Wave 2 Vitest coverage
        run: |
          npx vitest run \
            src/lib/audit/source-input.test.ts \
            src/lib/audit/website-input.test.ts \
            src/lib/audit/similar-businesses-wave2.test.ts \
            src/lib/audit/question-suggestion-wave2.test.ts \
            src/lib/audit/wave2-integration-wiring.test.ts \
            src/lib/audit/customer-error.test.ts \
            src/lib/audit/customer-evidence-export.test.ts \
            src/lib/audit/report-excerpt.test.ts \
            src/lib/audit/report-pipeline.test.ts \
            src/lib/public-truth-wave2.test.ts \
            src/lib/audit/wave2-route-contract.test.ts \
            tests/e2e/network-guard.test.ts \
            tests/e2e/shared-config.test.ts \
            tests/verify-offline.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Spec 004/offline external-host browser guard
        run: npx playwright test tests/e2e/offline-network.spec.ts

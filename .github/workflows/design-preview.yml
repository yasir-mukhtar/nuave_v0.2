name: Design preview

on:
  push:
    branches:
      - design/intake-brief-concept
  workflow_dispatch:

concurrency:
  group: design-preview-intake-brief
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out concept branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-mutating checks
        run: npm run check

      - name: Prepare safe preview build environment
        run: |
          cat > .env.production.local <<'EOF'
          NUAVE_PROVIDER=opencodego
          NUAVE_QUESTION_PROVIDER=opencodego
          OPENCODEGO_API_KEY=dummy-design-preview-key
          OPENAI_API_KEY=dummy-design-preview-key
          OPENAI_BASE_URL=https://opencode.ai/zen/go/v1
          OPENAI_AUDIT_MODEL=gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT=low
          NUAVE_FIXTURE_PREVIEW_ENABLED=false
          EOF

      - name: Build Cloudflare preview
        run: npm run build:cf

      - name: Deploy isolated preview worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name nuave-intake-brief-concept

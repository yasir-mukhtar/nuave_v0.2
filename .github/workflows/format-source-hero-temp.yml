name: Format SourceHero (temporary)

on:
  push:
    branches:
      - fix/source-hero-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format SourceHero files
        run: npx prettier --write src/app/audit/SourceHero.module.css src/app/audit/SourceHero.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet -- src/app/audit/SourceHero.module.css src/app/audit/SourceHero.tsx; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/audit/SourceHero.module.css src/app/audit/SourceHero.tsx
          git commit -m "style: format SourceHero files"
          git push

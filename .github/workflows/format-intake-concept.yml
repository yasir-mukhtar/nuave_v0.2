name: Format intake concept

on:
  push:
    branches:
      - design/intake-brief-concept

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: design/intake-brief-concept

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format concept
        run: npx prettier --write src/app/concepts/intake-brief/IntakeBriefConcept.tsx

      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/concepts/intake-brief/IntakeBriefConcept.tsx
          git commit -m "Format intake brief concept"
          git push origin HEAD:design/intake-brief-concept

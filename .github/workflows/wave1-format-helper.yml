name: Wave 1 Format Helper

on:
  push:
    branches:
      - fix/wave1-shared-invariants-2026-08-23

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/wave1-shared-invariants-2026-08-23

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Wave 1 files only
        run: |
          npx prettier --write \
            src/app/audit/AuditWorkflow.tsx \
            src/lib/audit/locked-question-pack.test.ts \
            src/lib/audit/locked-question-pack.ts \
            src/lib/audit/production-observation-method.ts \
            src/lib/audit/protected-observation-method.test.ts \
            src/lib/audit/variance-route-proof.test.ts \
            src/lib/audit/workflow-operation-generation.ts

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/audit/AuditWorkflow.tsx \
            src/lib/audit/locked-question-pack.test.ts \
            src/lib/audit/locked-question-pack.ts \
            src/lib/audit/production-observation-method.ts \
            src/lib/audit/protected-observation-method.test.ts \
            src/lib/audit/variance-route-proof.test.ts \
            src/lib/audit/workflow-operation-generation.ts
          git commit -m "Format Wave 1 changes"
          git push origin HEAD:fix/wave1-shared-invariants-2026-08-23

name: Run similar-businesses implementation

on:
  pull_request:
    branches:
      - fix/spec-003-live-audit-reliability

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/similar-businesses-intake
          fetch-depth: 0

      - name: Execute corrected implementation script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/implement-similar-businesses.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Use Node.js 22"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace("textwrap.dedent(r'''\\\n", "textwrap.dedent(r'''\n")
          Path('/tmp/implement_similar_businesses.py').write_text(script)
          PY
          python /tmp/implement_similar_businesses.py

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/lib/audit/types.ts \
            src/lib/audit/openai.ts \
            src/lib/audit/similar-businesses.ts \
            src/lib/audit/similar-businesses.test.ts \
            src/lib/audit/workflow-storage.ts \
            src/lib/audit/workflow-storage.test.ts \
            src/app/audit/AuditWorkflow.tsx \
            src/app/audit/AuditStages.tsx \
            src/app/audit/SimilarBusinessesEditor.tsx \
            src/app/audit/SimilarBusinessesEditor.module.css \
            src/app/api/audit/prompts/route.ts

      - name: Run checks
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build Cloudflare worker without deployment
        env:
          NUAVE_PROVIDER: opencodego
          NUAVE_QUESTION_PROVIDER: opencodego
          OPENCODEGO_API_KEY: dummy-build-only-key
          OPENAI_API_KEY: dummy-build-only-key
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          OPENAI_AUDIT_MODEL: gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT: low
        run: |
          trap 'rm -f .env.production.local' EXIT
          cat > .env.production.local <<EOF
          NUAVE_PROVIDER=${NUAVE_PROVIDER}
          NUAVE_QUESTION_PROVIDER=${NUAVE_QUESTION_PROVIDER}
          OPENCODEGO_API_KEY=${OPENCODEGO_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          OPENAI_AUDIT_MODEL=${OPENAI_AUDIT_MODEL}
          OPENAI_AUDIT_REASONING_EFFORT=${OPENAI_AUDIT_REASONING_EFFORT}
          EOF
          npm run build:cf

      - name: Remove temporary workflows
        run: |
          rm .github/workflows/implement-similar-businesses.yml
          rm .github/workflows/implement-similar-businesses-runner.yml

      - name: Commit final implementation
        run: |
          git config user.name "nuave-implementation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: make similar businesses optional"
          git push origin HEAD:feature/similar-businesses-intake

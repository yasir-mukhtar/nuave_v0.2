name: Apply intake iteration

on:
  push:
    branches:
      - feat/progressive-business-facts

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply requested intake UI simplifications'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/progressive-business-facts

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply requested UI simplifications
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          workflow = Path('src/app/audit/AuditWorkflow.tsx')
          text = workflow.read_text()
          text = text.replace('import { IconCheck, IconDownload } from "@tabler/icons-react";', 'import { IconDownload } from "@tabler/icons-react";')
          text = re.sub(r'\nconst stepLabels = \[\n(?:.*\n)*?\];\n', '\n', text, count=1)
          text = re.sub(
              r'\n  function backToSource\(\) \{\n(?:.*\n)*?  \}\n\n  function backToFacts',
              '\n  function backToFacts',
              text,
              count=1,
          )
          text = re.sub(
              r'\n      \{step > 0 && step < 4 \? \(\n        <nav[\s\S]*?      \) : null\}\n',
              '\n',
              text,
              count=1,
          )
          text = text.replace('          onBack={backToSource}\n', '')
          workflow.write_text(text)

          stages = Path('src/app/audit/AuditStages.tsx')
          text = stages.read_text()
          text = text.replace('  onBack,\n  onLogo,', '  onLogo,', 1)
          text = text.replace('  onBack: () => void;\n  onLogo:', '  onLogo:', 1)
          text = re.sub(
              r'\n      <Button\n        type="button"\n        variant="ghost"\n        onClick=\{onBack\}\n        className=\{styles\.backButton\}\n      >\n        <IconArrowLeft /> Ganti website\n      </Button>\n',
              '\n',
              text,
              count=1,
          )
          text = re.sub(
              r'\n      \{extraction\?\.warnings\.length \? \(\n        <WarningAlert title="Periksa informasi ini">[\s\S]*?      \) : null\}\n',
              '\n',
              text,
              count=1,
          )
          text = text.replace(
              '<div className={`${styles.stickyAction} flex-wrap`}>',
              '<div className={`${styles.stickyAction} flex-nowrap`}>',
              1,
          )
          text = text.replace(
              '<div className="flex w-full items-center justify-between gap-3">',
              '<div className="flex w-full flex-nowrap items-center gap-3">',
              1,
          )
          text = text.replace(
              'variant="ghost"\n                onClick={() => goBack(screen)}\n              >',
              'variant="ghost"\n                onClick={() => goBack(screen)}\n                className="min-w-0 flex-1"\n              >',
              1,
          )
          text = text.replace(
              'variant="default"\n                onClick={() => navigate("details")}\n              >',
              'variant="default"\n                onClick={() => navigate("details")}\n                className="min-w-0 flex-1"\n              >',
              1,
          )
          text = text.replace(
              'variant="default"\n                onClick={() => advance(screen)}\n              >',
              'variant="default"\n                onClick={() => advance(screen)}\n                className="min-w-0 flex-1"\n              >',
              1,
          )
          stages.write_text(text)

          css = Path('src/app/audit/audit.module.css')
          text = css.read_text()
          text = text.replace(
              '  position: sticky;\n  top: 0;\n  z-index: 30;\n',
              '  position: static;\n',
              1,
          )
          css.write_text(text)

          tweak = Path('src/app/audit/tweakcn-intake.css')
          text = tweak.read_text().rstrip() + '''\n\n/* Progressive intake iteration: keep the field structure but remove visible form cards and internal section headings. */\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-brand-heading),\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-offer-heading),\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-customer-heading),\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-market-heading),\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-similar-heading),\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-details-heading) {\n  margin-bottom: 0;\n  gap: 0;\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n  padding: 0;\n  box-shadow: none;\n}\n\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-brand-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-offer-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-customer-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-market-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-similar-heading) > header,\nmain[data-theme="light"]:has(section[lang="id"])\n  section:has(> header > #business-facts-details-heading) > header {\n  display: none;\n}\n'''
          tweak.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, types, and lint
        run: npm run check

      - name: Commit iteration
        run: |
          git config user.name "Yasir Mukhtar"
          git config user.email "yasir.mukhtar@yahoo.com"
          git add -- src/app/audit/AuditWorkflow.tsx src/app/audit/AuditStages.tsx src/app/audit/audit.module.css src/app/audit/tweakcn-intake.css
          git diff --cached --check
          git commit -m "Simplify progressive intake presentation"
          git push origin HEAD:feat/progressive-business-facts

name: Preview cleanup

# "Run workflow" by hand: removes every PR preview worker (nuave-pr-<number>)
# whose PR is no longer open. The PR Preview workflow already removes a
# preview when its PR closes; this clears any it missed. Leave "dry run"
# ticked to see the list first.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be removed, change nothing
        type: boolean
        default: true

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sweep:
    name: Remove previews of closed PRs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remove leftover preview workers
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/preview-cleanup.sh

                }

                .removeButton {
                  grid-column: 2;
                  grid-row: 1;
                }
              }
              '''),
          )

          replace(
              "src/app/audit/AuditStages.tsx",
              'import { INDONESIAN_RUN_STATUS_LABELS } from "@/lib/audit/report-labels";\nimport styles from "./audit.module.css";',
              'import { INDONESIAN_RUN_STATUS_LABELS } from "@/lib/audit/report-labels";\nimport SimilarBusinessesEditor from "./SimilarBusinessesEditor";\nimport styles from "./audit.module.css";',
          )
          sub(
              "src/app/audit/AuditStages.tsx",
              r'''\n      <StageSection\n        id="competitor-heading".*?\n      </StageSection>''',
              '''
                    <StageSection
                      id="similar-businesses-heading"
                      title="Bisnis lain yang serupa"
                      description="Opsional. Tambahkan bisnis yang serupa atau sering dibandingkan dengan bisnis Anda. Saran dari Nuave tetap dapat Anda hapus atau ubah."
                    >
                      <Fieldset aria-labelledby="similar-businesses-heading">
                        <SimilarBusinessesEditor
                          businesses={brief.similar_businesses ?? []}
                          onChange={(value) =>
                            updateBrief("similar_businesses", value)
                          }
                        />
                      </Fieldset>
                    </StageSection>''',
          )

          replace(
              "src/app/audit/AuditWorkflow.tsx",
              'import { AUDIT_CLIENT_CONTRACT_VERSION } from "@/lib/audit/client-contract";',
              '''import { AUDIT_CLIENT_CONTRACT_VERSION } from "@/lib/audit/client-contract";
          import {
            sanitizeAiSimilarBusinesses,
            withPrimarySimilarBusiness,
          } from "@/lib/audit/similar-businesses";''',
          )
          replace(
              "src/app/audit/AuditWorkflow.tsx",
              '  verified_competitor: { name: "", scope: "", source_url: "" },\n  brand_name_variants: [],',
              '  verified_competitor: { name: "", scope: "", source_url: "" },\n  similar_businesses: [],\n  brand_name_variants: [],',
          )
          sub(
              "src/app/audit/AuditWorkflow.tsx",
              r'''      const draft = result\.draft;\n.*?      setFactsExtracted\(true\);''',
              '''      const draft = result.draft;
                    const similarBusinesses = sanitizeAiSimilarBusinesses(
                      draft.similar_businesses ?? [],
                    );
                    setExtraction({
                      ...draft,
                      similar_businesses: similarBusinesses,
                    });
                    setBrief((current) =>
                      withPrimarySimilarBusiness({

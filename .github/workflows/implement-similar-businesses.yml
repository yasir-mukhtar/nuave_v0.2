          Path("src/lib/audit/similar-businesses.test.ts").write_text('''import { describe, expect, it } from "vitest";
          import { extractionModelDraftSchema } from "./openai";
          import { goldenBrief } from "./fixtures/report-golden";
          import {
            MAX_SIMILAR_BUSINESSES,
            normalizeSimilarBusinessUrl,
            normalizeSimilarBusinesses,
            sanitizeAiSimilarBusinesses,
            withPrimarySimilarBusiness,
          } from "./similar-businesses";
          import { businessBriefSchema } from "./types";

          describe("similar-business intake", () => {
            it("allows the audit brief to continue with no competitor", () => {
              const result = businessBriefSchema.safeParse({
                ...goldenBrief,
                verified_competitor: { name: "", scope: "", source_url: "" },
                similar_businesses: [],
              });
              expect(result.success).toBe(true);
            });

            it("normalizes URL-only input and derives the legacy primary comparison", () => {
              const prepared = withPrimarySimilarBusiness({
                ...goldenBrief,
                similar_businesses: [
                  { source_url: "amanieadvisors.com", origin: "user" },
                ],
              });
              expect(prepared.similar_businesses?.[0]?.source_url).toBe(
                "https://amanieadvisors.com/",
              );
              expect(prepared.verified_competitor).toEqual({
                name: "amanieadvisors.com",
                scope: "",
                source_url: "https://amanieadvisors.com/",
              });
            });

            it("preserves an AI-supplied name without asking the user for scope", () => {
              const prepared = withPrimarySimilarBusiness({
                ...goldenBrief,
                similar_businesses: [
                  {
                    name: "Amanie Advisors",
                    source_url: "https://amanieadvisors.com/",
                    origin: "ai",
                  },
                ],
              });
              expect(prepared.verified_competitor).toEqual({
                name: "Amanie Advisors",
                scope: "",
                source_url: "https://amanieadvisors.com/",
              });
            });

            it("deduplicates entries, drops blanks, and caps the list", () => {
              const input = [
                { source_url: "example.com" },
                { source_url: "https://example.com/" },
                { source_url: "" },
                ...Array.from({ length: 8 }, (_, index) => ({
                  source_url: `https://peer-${index}.example/`,
                })),
              ];
              const normalized = normalizeSimilarBusinesses(input);
              expect(normalized).toHaveLength(MAX_SIMILAR_BUSINESSES);
              expect(normalized[0]?.source_url).toBe("https://example.com/");
            });

            it("keeps invalid user input visible for validation but rejects it in the brief", () => {
              const invalid = normalizeSimilarBusinessUrl("not a valid url");
              expect(invalid).toBe("not a valid url");
              expect(
                businessBriefSchema.safeParse({
                  ...goldenBrief,
                  similar_businesses: [{ source_url: invalid, origin: "user" }],
                }).success,
              ).toBe(false);
            });

            it("drops invalid AI suggestions before they reach the editable brief", () => {
              const suggestions = sanitizeAiSimilarBusinesses([
                { name: "Valid", source_url: "https://valid.example/" },
                { name: "Bad", source_url: "javascript:alert(1)" },
              ]);
              expect(suggestions).toEqual([
                {
                  name: "Valid",
                  source_url: "https://valid.example/",
                  origin: "ai",
                },
              ]);
            });

            it("extends the extraction contract with similar-business suggestions", () => {
              const draft = extractionModelDraftSchema.parse({
                brand_name: "Contoh",
                entity_scope: "Indonesia",
                brand_type: "Company",
                category: "Consulting",
                market_context: "Indonesia",
                target_customer: "Business owners",
                official_sources: ["https://contoh.example/"],
                verified_offerings: ["Advisory"],
                verified_customer_needs: [],
                verified_decision_criteria: [],
                brand_name_variants: [],
                priority_offering: "",
                conversion_action: "",
                customer_supplied_facts: [],
                known_accuracy_questions: [],
                usp: "",
                regulated_category_notes: "",
                evidence: [],
                warnings: [],
                similar_businesses: [
                  {
                    name: "Peer Business",
                    source_url: "https://peer.example/",
                  },
                ],
              });
              expect(draft.similar_businesses).toEqual([
                {
                  name: "Peer Business",
                  source_url: "https://peer.example/",
                },
              ]);
            });
          });
          ''')
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/lib/audit/types.ts \
            src/lib/audit/openai.ts \
            src/lib/audit/similar-businesses.ts \
            src/lib/audit/similar-businesses.test.ts \
            src/lib/audit/workflow-storage.ts \
            src/lib/audit/workflow-storage.test.ts \
            src/app/audit/AuditWorkflow.tsx \
            src/app/audit/AuditStages.tsx \
            src/app/audit/SimilarBusinessesEditor.tsx \
            src/app/audit/SimilarBusinessesEditor.module.css \
            src/app/api/audit/prompts/route.ts

      - name: Run checks
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build Cloudflare worker without deployment
        env:
          NUAVE_PROVIDER: opencodego
          NUAVE_QUESTION_PROVIDER: opencodego
          OPENCODEGO_API_KEY: dummy-build-only-key
          OPENAI_API_KEY: dummy-build-only-key
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          OPENAI_AUDIT_MODEL: gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT: low
        run: |
          trap 'rm -f .env.production.local' EXIT
          cat > .env.production.local <<EOF
          NUAVE_PROVIDER=${NUAVE_PROVIDER}
          NUAVE_QUESTION_PROVIDER=${NUAVE_QUESTION_PROVIDER}
          OPENCODEGO_API_KEY=${OPENCODEGO_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          OPENAI_AUDIT_MODEL=${OPENAI_AUDIT_MODEL}
          OPENAI_AUDIT_REASONING_EFFORT=${OPENAI_AUDIT_REASONING_EFFORT}
          EOF
          npm run build:cf

      - name: Remove temporary implementation workflow
        run: rm .github/workflows/implement-similar-businesses.yml

      - name: Commit final implementation
        run: |
          git config user.name "nuave-implementation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: make similar businesses optional"
          git push origin HEAD:feature/similar-businesses-intake

name: Implement similar-businesses intake

on:
  pull_request:
    branches:
      - fix/spec-003-live-audit-reliability

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/similar-businesses-intake
          fetch-depth: 0

      - name: Apply bounded implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              Path(path).write_text(content)

          def replace(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def sub(path: str, pattern: str, new: str) -> None:
              text = read(path)
              replaced, count = re.subn(
                  pattern,
                  lambda _match: new,
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, found {count}: {pattern[:100]!r}")
              write(path, replaced)

          # Shared contracts: similar businesses are optional, while the legacy
          # verified_competitor field remains as a derived compatibility value.
          replace(
              "src/lib/audit/types.ts",
              '''export const sourceSchema = z.object({
            url: sourceUrl,
            title: z.string().trim().max(SOURCE_TITLE_MAX_LENGTH),
          });''',
              '''export const sourceSchema = z.object({
            url: sourceUrl,
            title: z.string().trim().max(SOURCE_TITLE_MAX_LENGTH),
          });

          const optionalSourceUrl = z.union([sourceUrl, z.literal("")]);

          export const similarBusinessSchema = z.object({
            name: z.string().trim().max(160).optional(),
            source_url: optionalSourceUrl,
            origin: z.enum(["ai", "user"]).optional(),
          });''',
          )
          sub(
              "src/lib/audit/types.ts",
              r'''  verified_competitor: z\.object\(\{\n\s+name: requiredText\.max\(160\),\n\s+scope: requiredText\.max\(300\),\n\s+source_url: sourceUrl,\n\s+\}\),''',
              '''  verified_competitor: z.object({
            name: z.string().trim().max(160),
            scope: z.string().trim().max(300),
            source_url: optionalSourceUrl,
          }),
            similar_businesses: z.array(similarBusinessSchema).max(5).optional(),''',
          )
          replace(
              "src/lib/audit/types.ts",
              '''export type Source = z.infer<typeof sourceSchema>;
          export type BusinessBrief = z.infer<typeof businessBriefSchema>;
          export type ExtractionDraft = z.infer<typeof extractionDraftSchema>;''',
              '''export type Source = z.infer<typeof sourceSchema>;
          export type SimilarBusiness = z.infer<typeof similarBusinessSchema>;
          export type BusinessBrief = z.infer<typeof businessBriefSchema>;
          export type ExtractionDraft = z.infer<typeof extractionDraftSchema> & {
            similar_businesses?: SimilarBusiness[];
          };''',
          )

          # Existing extraction call remains one call with official-domain-only
          # search. The model may return conservative, explicitly unverified
          # similar-business suggestions from model knowledge; no extra provider
          # request or wider search is introduced.
          replace(
              "src/lib/audit/openai.ts",
              'import OpenAI from "openai";\nimport { zodTextFormat } from "openai/helpers/zod";',
              'import OpenAI from "openai";\nimport { z } from "zod";\nimport { zodTextFormat } from "openai/helpers/zod";',
          )
          replace(
              "src/lib/audit/openai.ts",
              'type ExtractionResponseResult = Pick<',
              '''export const extractionModelDraftSchema = extractionDraftSchema.extend({
            similar_businesses: z
              .array(
                z.object({
                  name: z.string().trim().min(1).max(160),
                  source_url: z.string().trim().min(1).max(2_000),
                }),
              )
              .max(3),
          });

          type ExtractionResponseResult = Pick<''',
          )
          replace(
              "src/lib/audit/openai.ts",
              '    verified_decision_criteria: [],\n    brand_name_variants: [],',
              '    verified_decision_criteria: [],\n    similar_businesses: [],\n    brand_name_variants: [],',
          )
          replace(
              "src/lib/audit/openai.ts",
              '  "Return at most eight items in any list.",',
              '  "Return at most eight items in any list.",\n  "Return at most three similar_businesses suggestions.",',
          )
          replace(
              "src/lib/audit/openai.ts",
              '      format: zodTextFormat(extractionDraftSchema, "nuave_business_draft"),',
              '''      format: zodTextFormat(
                extractionModelDraftSchema,
                "nuave_business_draft",
              ),''',
          )
          replace(
              "src/lib/audit/openai.ts",
              '          "Do not infer praise, reputation, quality, target demographics, outcomes, or competitor facts.",',
              '''          "Do not infer praise, reputation, quality, target demographics, or outcomes.",
                    "All ordinary business facts must be supported by the official website. similar_businesses is the only exception: it is an optional suggestion list for human review, not a verified fact.",
                    "Suggest at most three genuinely comparable businesses only when you can supply a specific public website, Instagram profile, or Google Business Profile URL with high confidence from existing model knowledge. Never include the audited business itself. Never guess or fabricate a business or URL; return an empty list when uncertain.",
                    "Do not add similar_businesses items to evidence, and do not claim they were found on the official website unless the website actually supports that.",
                    "Web search remains restricted to the supplied official domain; do not imply that competitor URLs were web-verified by this extraction call.",''',
          )

          write(
              "src/lib/audit/similar-businesses.ts",
              textwrap.dedent(r'''\
              import type { BusinessBrief, SimilarBusiness } from "./types";

              export const MAX_SIMILAR_BUSINESSES = 5;

              function hasExplicitScheme(value: string) {
                return /^[a-z][a-z0-9+.-]*:\/\//i.test(value);
              }

              export function normalizeSimilarBusinessUrl(value: string) {
                const trimmed = value.trim();
                if (!trimmed) return "";
                const candidate = hasExplicitScheme(trimmed)
                  ? trimmed
                  : `https://${trimmed}`;
                try {
                  const parsed = new URL(candidate);
                  if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
                    return trimmed;
                  }
                  parsed.hash = "";
                  return parsed.toString();
                } catch {
                  return trimmed;
                }
              }

              export function isValidSimilarBusinessUrl(value: string) {
                const normalized = normalizeSimilarBusinessUrl(value);
                if (!normalized) return false;
                try {
                  const parsed = new URL(normalized);
                  return parsed.protocol === "http:" || parsed.protocol === "https:";
                } catch {
                  return false;
                }
              }

              export function similarBusinessDisplayName(value: string) {
                if (!isValidSimilarBusinessUrl(value)) return "";
                const parsed = new URL(normalizeSimilarBusinessUrl(value));
                const hostname = parsed.hostname.replace(/^www\./, "").toLowerCase();
                if (
                  hostname === "instagram.com" ||
                  hostname.endsWith(".instagram.com")
                ) {
                  const handle = parsed.pathname.split("/").filter(Boolean)[0];
                  return handle ? `@${handle}` : "";
                }
                if (
                  hostname === "maps.app.goo.gl" ||
                  hostname === "goo.gl" ||
                  hostname === "google.com" ||
                  hostname.endsWith(".google.com") ||
                  hostname.endsWith(".google.co.id")
                ) {
                  return "";
                }
                return hostname;
              }

              export function normalizeSimilarBusinesses(
                businesses: SimilarBusiness[] = [],
              ): SimilarBusiness[] {
                const normalized: SimilarBusiness[] = [];
                const seen = new Set<string>();
                for (const business of businesses) {
                  const sourceUrl = normalizeSimilarBusinessUrl(business.source_url);
                  if (!sourceUrl) continue;
                  const key = sourceUrl.replace(/\/$/, "").toLowerCase();
                  if (seen.has(key)) continue;
                  seen.add(key);
                  normalized.push({
                    source_url: sourceUrl,
                    ...(business.name?.trim() ? { name: business.name.trim() } : {}),
                    ...(business.origin ? { origin: business.origin } : {}),
                  });
                  if (normalized.length >= MAX_SIMILAR_BUSINESSES) break;
                }
                return normalized;
              }

              export function sanitizeAiSimilarBusinesses(
                businesses: SimilarBusiness[] = [],
              ) {
                return normalizeSimilarBusinesses(
                  businesses.map((business) => ({
                    ...business,
                    origin: "ai" as const,
                  })),
                ).filter((business) =>
                  isValidSimilarBusinessUrl(business.source_url),
                );
              }

              export function withPrimarySimilarBusiness(
                brief: BusinessBrief,
              ): BusinessBrief {
                if (brief.similar_businesses === undefined) return brief;
                const similarBusinesses = normalizeSimilarBusinesses(
                  brief.similar_businesses,
                );
                const primary = similarBusinesses.find((business) =>
                  isValidSimilarBusinessUrl(business.source_url),
                );
                if (!primary) {
                  return {
                    ...brief,
                    similar_businesses: similarBusinesses,
                    verified_competitor: {
                      name: "",
                      scope: "",
                      source_url: "",
                    },
                  };
                }
                return {
                  ...brief,
                  similar_businesses: similarBusinesses,
                  verified_competitor: {
                    name:
                      primary.name?.trim() ||
                      similarBusinessDisplayName(primary.source_url),
                    scope: "",
                    source_url: primary.source_url,
                  },
                };
              }
              '''),
          )

          write(
              "src/app/audit/SimilarBusinessesEditor.tsx",
              textwrap.dedent('''\
              "use client";

              import { Button, Input, Label, TextField } from "@heroui/react";
              import { IconPlus, IconX } from "@tabler/icons-react";
              import {
                MAX_SIMILAR_BUSINESSES,
                normalizeSimilarBusinessUrl,
                normalizeSimilarBusinesses,
              } from "@/lib/audit/similar-businesses";
              import type { SimilarBusiness } from "@/lib/audit/types";
              import styles from "./SimilarBusinessesEditor.module.css";

              export default function SimilarBusinessesEditor({
                businesses,
                onChange,
              }: {
                businesses: SimilarBusiness[];
                onChange: (businesses: SimilarBusiness[]) => void;
              }) {
                function updateEntry(index: number, sourceUrl: string) {
                  onChange(
                    businesses.map((business, businessIndex) =>
                      businessIndex === index
                        ? { ...business, source_url: sourceUrl, origin: "user" }
                        : business,
                    ),
                  );
                }

                function commitEntry(index: number) {
                  const next = businesses.map((business, businessIndex) =>
                    businessIndex === index
                      ? {
                          ...business,
                          source_url: normalizeSimilarBusinessUrl(
                            business.source_url,
                          ),
                        }
                      : business,
                  );
                  onChange(normalizeSimilarBusinesses(next));
                }

                function removeEntry(index: number) {
                  onChange(
                    businesses.filter(
                      (_, businessIndex) => businessIndex !== index,
                    ),
                  );
                }

                function addEntry() {
                  if (businesses.length >= MAX_SIMILAR_BUSINESSES) return;
                  onChange([
                    ...businesses,
                    { source_url: "", origin: "user" as const },
                  ]);
                }

                return (
                  <div className={styles.root}>
                    {businesses.map((business, index) => (
                      <div className={styles.row} key={index}>
                        <TextField fullWidth>
                          <Label className={styles.visuallyHidden}>
                            URL bisnis serupa {index + 1}
                          </Label>
                          <Input
                            type="url"
                            value={business.source_url}
                            placeholder="https://contoh-bisnis.com"
                            onChange={(event) =>
                              updateEntry(index, event.target.value)
                            }
                            onBlur={() => commitEntry(index)}
                          />
                        </TextField>
                        {business.origin === "ai" && business.source_url ? (
                          <span className={styles.aiBadge}>Saran Nuave</span>
                        ) : null}
                        <Button
                          type="button"
                          variant="ghost"
                          className={styles.removeButton}
                          aria-label={`Hapus bisnis serupa ${index + 1}`}
                          onPress={() => removeEntry(index)}
                        >
                          <IconX />
                        </Button>
                      </div>
                    ))}

                    <Button
                      type="button"
                      variant="ghost"
                      className={styles.addButton}
                      isDisabled={businesses.length >= MAX_SIMILAR_BUSINESSES}
                      onPress={addEntry}
                    >
                      <IconPlus />
                      <span>Tambah bisnis serupa</span>
                    </Button>
                    <p className={styles.hint}>
                      Website, profil Instagram, atau Google Business Profile.
                      Opsional, maksimal {MAX_SIMILAR_BUSINESSES} bisnis.
                    </p>
                  </div>
                );
              }
              '''),
          )

          write(

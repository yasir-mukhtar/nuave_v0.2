name: Refresh progressive intake preview

on:
  push:
    branches:
      - feat/progressive-business-facts

permissions:
  contents: read

jobs:
  upload-preview:
    if: github.event.head_commit.message == 'Refresh intake preview for UI iteration'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NUAVE_PROVIDER: opencodego
      NUAVE_QUESTION_PROVIDER: opencodego
      OPENCODEGO_API_KEY: ${{ secrets.OPENCODEGO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENCODEGO_API_KEY }}
      OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
      OPENAI_AUDIT_MODEL: gpt-5.6-luna
      OPENAI_AUDIT_REASONING_EFFORT: low
      NUAVE_FIXTURE_PREVIEW_ENABLED: ${{ secrets.NUAVE_FIXTURE_PREVIEW_ENABLED }}
      NUAVE_FIXTURE_FORCE_REPORT_FAILURE: ${{ secrets.NUAVE_FIXTURE_FORCE_REPORT_FAILURE }}
      OPENAI_AUDIT_CARRYOVER_COST_USD: ${{ secrets.OPENAI_AUDIT_CARRYOVER_COST_USD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/progressive-business-facts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and upload preview
        run: |
          set -euo pipefail
          trap 'rm -f .env.production.local' EXIT
          cat > .env.production.local <<EOF
          NUAVE_PROVIDER=${NUAVE_PROVIDER}
          NUAVE_QUESTION_PROVIDER=${NUAVE_QUESTION_PROVIDER}
          OPENCODEGO_API_KEY=${OPENCODEGO_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          OPENAI_AUDIT_MODEL=${OPENAI_AUDIT_MODEL}
          OPENAI_AUDIT_REASONING_EFFORT=${OPENAI_AUDIT_REASONING_EFFORT}
          NUAVE_FIXTURE_PREVIEW_ENABLED=${NUAVE_FIXTURE_PREVIEW_ENABLED}
          NUAVE_FIXTURE_FORCE_REPORT_FAILURE=${NUAVE_FIXTURE_FORCE_REPORT_FAILURE}
          OPENAI_AUDIT_CARRYOVER_COST_USD=${OPENAI_AUDIT_CARRYOVER_COST_USD}
          EOF
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare upload --preview-alias intake-30

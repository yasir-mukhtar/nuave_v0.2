name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build-time env. The OpenNext Cloudflare adapter inlines process.env
      # ONLY from Next.js .env* files (verified: shell env vars are ignored at
      # build time), so we write a gitignored .env.production.local from the
      # GitHub secrets. This file is never committed (see .gitignore) and the
      # values never appear in logs. No NEXT_PUBLIC_ vars.
      - name: Prepare build env
        run: |
          cat > .env.production.local <<'EOF'
          NUAVE_PROVIDER=opencodego
          NUAVE_QUESTION_PROVIDER=opencodego
          OPENCODEGO_API_KEY=${{ secrets.OPENCODEGO_API_KEY }}
          # The audit implementation uses the OpenAI SDK against OpenCode Go's
          # Responses-compatible endpoint. Keep this server-only compatibility
          # alias so OpenNext can inline the credential at build time.
          OPENAI_API_KEY=${{ secrets.OPENCODEGO_API_KEY }}
          OPENAI_BASE_URL=https://opencode.ai/zen/go/v1
          OPENAI_AUDIT_MODEL=gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT=low
          NUAVE_FIXTURE_PREVIEW_ENABLED=${{ secrets.NUAVE_FIXTURE_PREVIEW_ENABLED }}
          NUAVE_FIXTURE_FORCE_REPORT_FAILURE=${{ secrets.NUAVE_FIXTURE_FORCE_REPORT_FAILURE }}
          OPENAI_AUDIT_CARRYOVER_COST_USD=${{ secrets.OPENAI_AUDIT_CARRYOVER_COST_USD }}
          EOF

      - name: Build OpenNext worker
        run: npm run build:cf

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .

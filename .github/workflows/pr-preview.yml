name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  preview:
    name: Deploy PR preview
    # Repository policy: Dependabot-authored PRs do not deploy previews.
    # Dependabot-triggered runs receive Dependabot-scoped secrets, so this
    # repo's Cloudflare credentials are unavailable to them; attempting the
    # deploy would fail predictably. The author check (not the event actor)
    # keeps this true even when a human triggers the event on a bot PR.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare safe preview build env
        run: |
          cat > .env.production.local <<'EOF'
          NUAVE_PROVIDER=opencodego
          NUAVE_QUESTION_PROVIDER=opencodego
          OPENCODEGO_API_KEY=dummy-pr-preview-key
          OPENAI_API_KEY=dummy-pr-preview-key
          OPENAI_BASE_URL=https://opencode.ai/zen/go/v1
          OPENAI_AUDIT_MODEL=gpt-5.6-luna
          OPENAI_AUDIT_REASONING_EFFORT=low
          NUAVE_FIXTURE_PREVIEW_ENABLED=true
          NUAVE_FIXTURE_FORCE_REPORT_FAILURE=false
          EOF

      - name: Build OpenNext worker
        run: npm run build:cf

      - name: Deploy isolated preview worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name nuave-pr-${{ github.event.pull_request.number }}
          workingDirectory: .

      - name: Normalize preview URL
        id: preview-url
        env:
          RAW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          preview_url="$(printf '%s' "${RAW_DEPLOYMENT_URL}" | sed 's/ .*//' | tr -d '\r\n')"
          if [ -z "${preview_url}" ]; then
            echo "::error::Cloudflare did not return a preview URL."
            exit 1
          fi
          if [[ "${preview_url}" != http://* && "${preview_url}" != https://* ]]; then
            preview_url="https://${preview_url}"
          fi
          echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"

      - name: Publish review link on the PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          set -euo pipefail
          marker='<!-- nuave-pr-preview -->'
          body="${marker}
          ### Nuave preview ready

          **Landing page:** ${PREVIEW_URL}

          **Full fixture journey:** ${PREVIEW_URL}/audit/fixture

          This preview is isolated from production. Live AI-provider credentials are disabled; use the fixture journey to review the audit/report UI safely.

          Updated from commit \`${GITHUB_SHA}\`."

          comment_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- nuave-pr-preview -->"))) | .id' \
              | tail -n 1
          )"

          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="${body}" >/dev/null
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" >/dev/null
          fi

      - name: Add preview links to job summary
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          {
            echo '## Nuave PR preview'
            echo
            echo "- Landing: ${PREVIEW_URL}"
            echo "- Fixture journey: ${PREVIEW_URL}/audit/fixture"
            echo
            echo 'Provider-backed audit calls are intentionally disabled in this preview.'
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: Remove closed PR preview
    # Same repository policy as the preview job above: Dependabot-authored
    # PRs never deploy previews, so their close events have nothing to
    # remove. Whether any historical preview workers were actually deleted is
    # not inferred here — that is separately scoped.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Remove isolated preview worker
        id: remove
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name nuave-pr-${{ github.event.pull_request.number }} --force

      # wrangler-action only sets command-output/command-stderr when the
      # command succeeds, so a failed delete cannot be classified from its
      # output. Probe the exact worker instead: only a structured
      # worker-not-found (404 + error code 10007) from the Scripts GET
      # endpoint confirms absence; anything else stays unconfirmed.
      - name: Probe whether the preview worker still exists
        id: probe
        if: steps.remove.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: nuave-pr-${{ github.event.pull_request.number }}
        run: node scripts/pr-preview-probe-worker.mjs

      - name: Resolve preview removal state
        id: state
        if: always()
        env:
          REMOVE_OUTCOME: ${{ steps.remove.outcome }}
          PROBE_EVIDENCE: ${{ steps.probe.outputs.evidence }}
        run: node scripts/pr-preview-cleanup-state.mjs

      - name: Update preview status on the PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REMOVE_STATE: ${{ steps.state.outputs.result }}
          WORKER_NAME: nuave-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          comment_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- nuave-pr-preview -->"))) | .id' \
              | tail -n 1
          )"
          if [ -z "${comment_id}" ]; then
            exit 0
          fi
          case "${REMOVE_STATE}" in
            removed|absent)
              body='<!-- nuave-pr-preview -->
            ### Nuave preview closed

            The isolated Cloudflare preview for this PR has been removed.'
              ;;
            *)
              body="<!-- nuave-pr-preview -->
            ### Nuave preview cleanup failed

            Removal of the isolated preview worker \`${WORKER_NAME}\` could not be confirmed. The worker may still exist; check this run's log and delete it manually if needed."
              ;;
          esac
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="${body}" >/dev/null

      - name: Fail cleanup when preview removal is unconfirmed
        if: >-
          always() &&
          steps.state.outputs.result != 'removed' &&
          steps.state.outputs.result != 'absent'
        run: |
          echo "::error::Preview worker nuave-pr-${{ github.event.pull_request.number }} removal was not confirmed; the worker may still exist."
          exit 1

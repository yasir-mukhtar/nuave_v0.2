name: Remove PR 28 preview

on:
  push:
    branches:
      - style/tweakcn-intake-preview

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove isolated PR 28 preview worker
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview worker
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name nuave-pr-28 --force

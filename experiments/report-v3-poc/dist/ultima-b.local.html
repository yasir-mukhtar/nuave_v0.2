<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Ultima Clinic PoC B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column (760px) of full-width bands, as in the approved
   Report v2 prototype. New v3 bands: Cek fakta, how AI describes the clinic,
   the page grid, the source map, the web-team and kit folds, the worksheet.
   Light palette only, as the product (Spec 021 A-11). */
:root {
  --bg: #ffffff;
  --surface: #f7f6fb;
  --surface-2: #f1f0f6;
  --fg: #16161d;
  --fg-2: #3b3a4a;
  --muted: #6b6a85;
  --faint: #a2a1b6;
  --line: #e7e6ee;
  --line-2: #d3d2de;
  --accent: #533afd;
  --accent-ink: #3620b8;
  --accent-soft: #e5e0ff;
  --accent-wash: #f5f3ff;
  --on-accent: #ffffff;
  --dot-none: #8f8ea6;
  --bad: #c52f4a;
  --bad-wash: #fdeef1;
  --good: #137a56;
  --good-wash: #e8f6ef;
  --warn: #a35a06;
  --warn-wash: #fff4e3;
  --ink: #16161d;
  --ink-fg: #f1f0f6;
  --ink-muted: #b9b8cc;
  --ink-line: #34333f;
  --scrim: rgba(22, 22, 29, 0.42);
  --shadow: 0 18px 48px rgba(22, 22, 29, 0.18);
  --ease: cubic-bezier(0.65, 0, 0.35, 1);
  --font-ui: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--accent-ink); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* PoC banner */
.poc { background: var(--accent-wash); border-bottom: 1px solid var(--accent-soft); }
.poc .wrap { padding-block: 10px; font-size: 13px; color: var(--accent-ink); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.poc strong { font-weight: 600; }

/* Top bar */
.top { border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; justify-content: space-between; align-items: center; padding-block: 14px; gap: 12px; }
.logo { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
.logo span { color: var(--accent); }
.top-actions { display: flex; gap: 8px; flex-wrap: nowrap; }
@media (max-width: 480px) { .top-actions .lg { display: none; } .top-actions .btn { padding: 6px 12px; } }
.btn { border: 1px solid var(--line-2); background: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:hover { border-color: var(--accent); }
.note-pop { font-size: 13px; color: var(--muted); }

/* Header */
.head .wrap { padding-block: 36px 8px; display: grid; gap: 10px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.clinic { font-size: clamp(36px, 7vw, 56px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.meta { color: var(--fg-2); font-size: 15px; }
.meta .sub { color: var(--muted); display: block; }
.verdict { font-size: clamp(20px, 3.2vw, 24px); line-height: 1.45; font-weight: 500; letter-spacing: -0.01em; margin-top: 14px; max-width: 34em; }

/* Source cards and dots */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
.card { border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card-src { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 15px; }
.card-src svg { width: 20px; height: 20px; }
.big { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.big small { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.card p { font-size: 14px; color: var(--fg-2); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.dotbtn { display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 2px; cursor: pointer; border-radius: 8px; }
.dotbtn span.n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--dot-none); background: transparent; position: relative; }
.dot.mentioned { background: var(--accent); border-color: var(--accent); }
.dot.recommended { background: var(--accent); border-color: var(--accent); }
.dot.recommended::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--on-accent); border-bottom: 2px solid var(--on-accent); transform: translateY(-1px) rotate(-45deg); }
.dot.cited { border-color: var(--accent); }
.dot.cited::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.dot.noaio::after { content: ""; width: 10px; height: 2px; background: var(--dot-none); }
.dot.failed { border-style: dashed; }
.dot.notasked { border-color: var(--line-2); border-style: dotted; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; padding: 10px 14px; background: var(--surface); border-radius: 14px; font-size: 13px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { width: 16px; height: 16px; border-width: 2px; }
.legend .dot.recommended::after { width: 7px; height: 4px; }
.legend .dot.cited::after { width: 5px; height: 5px; }
.legend .dot.noaio::after { width: 7px; }

/* Moment of truth */
.moment { margin-top: 22px; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.moment-h { padding: 14px 18px; background: var(--surface); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.moment-h b { color: var(--fg); font-weight: 600; }
.moment-b { padding: 18px; display: grid; gap: 14px; }
.bubble { justify-self: end; max-width: 88%; background: var(--surface-2); border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-size: 15px; }
.ai-list { display: grid; gap: 6px; }
.ai-item { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.ai-item .i { width: 22px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.ai-item b { font-weight: 600; }
.ai-item .why { color: var(--muted); }
.ai-you { border: 1px dashed var(--bad); background: var(--bad-wash); border-radius: 12px; padding: 10px 12px; color: var(--bad); font-weight: 600; font-size: 15px; }
.ai-you.ok { border-color: var(--accent); background: var(--accent-wash); color: var(--accent-ink); }
.moment-cap { font-size: 15px; color: var(--fg-2); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; justify-self: start; }

/* Side-by-side counts */
.compare { margin-top: 18px; display: grid; gap: 12px; }
.cmp-row { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; font-size: 14px; }
@media (max-width: 520px) { .cmp-row { grid-template-columns: 1fr; gap: 6px; } }
.cmp-src { font-weight: 600; }
.cmp-src small { display: block; font-weight: 400; color: var(--muted); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--dot-none); border-radius: 99px; }
.bar.you .bar-fill { background: var(--accent); }
.bar-label { font-size: 13px; color: var(--fg-2); white-space: nowrap; }
.bar-name { font-size: 13px; color: var(--fg-2); grid-column: 1 / -1; margin-bottom: -4px; }
.why-line { margin-top: 14px; font-size: 14px; color: var(--fg-2); background: var(--surface); border-radius: 12px; padding: 10px 14px; }
.stab { margin-top: 10px; font-size: 14px; color: var(--fg-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 6px; }
.stab-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stab-dots { display: inline-flex; gap: 4px; align-items: center; }
.brandq { gap: 10px; }
.bq-row { display: grid; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.bq-head { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.bq-q { font-weight: 500; color: var(--fg); }
.stab-dots .dot { width: 16px; height: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.smap-row .pill, .fact-sum .pill { white-space: normal; }
.pill.bad { background: var(--bad-wash); color: var(--bad); }
.pill.good { background: var(--good-wash); color: var(--good); }
.pill.warn { background: var(--warn-wash); color: var(--warn); }
.pill.acc { background: var(--accent-soft); color: var(--accent-ink); }
.ref { font-family: var(--font-mono); font-size: 12px; color: var(--muted); background: none; border: 0; padding: 0 2px; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.ref:hover { color: var(--accent-ink); }

/* Contents chips */
.toc .wrap { padding-block: 22px 6px; display: flex; flex-wrap: wrap; gap: 8px; }
.toc a { text-decoration: none; color: var(--fg-2); font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.toc a:hover { border-color: var(--accent); color: var(--accent-ink); }
@media (max-width: 640px) { .toc .wrap { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; } .toc a { white-space: nowrap; flex: none; } }

/* Bands */
.band { border-top: 1px solid var(--line); }
.band > .wrap { padding-block: 44px; display: grid; gap: 18px; }
.band h2 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.lede { color: var(--fg-2); font-size: 17px; max-width: 38em; }
.band.wash { background: linear-gradient(170deg, var(--bg) 40%, var(--accent-wash)); }
.band.ink { background: var(--ink); color: var(--ink-fg); border-top-color: var(--ink); }
.band.ink .lede, .band.ink p { color: var(--ink-fg); }
.band.grey { background: var(--surface); }

/* Findings */
.finding { display: grid; grid-template-columns: 190px 1fr; gap: 20px; padding-block: 18px; border-top: 1px solid var(--line); }
.finding:first-of-type { border-top: 0; padding-top: 4px; }
@media (max-width: 640px) { .finding { grid-template-columns: 1fr; gap: 8px; } }
.hl-num { font-size: 40px; font-weight: 700; color: var(--accent); letter-spacing: -0.03em; line-height: 1; }
.hl-cap { font-size: 13px; color: var(--muted); margin-top: 6px; }
.finding h3 { font-size: 19px; font-weight: 600; line-height: 1.35; margin-bottom: 6px; }
.finding p { color: var(--fg-2); }

/* Fact check */
.fact-sum { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.fact-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.fact q { quotes: "“" "”"; font-size: 16px; color: var(--fg); }
.fact-said { border-left: 3px solid var(--bad); padding-left: 12px; }
.fact-said.same { border-left-color: var(--good); }
.fact-said.none { border-left-color: var(--line-2); }
.fact-ref { font-size: 15px; color: var(--fg-2); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.fact-ref b { color: var(--fg); font-weight: 600; }
.fact-more { font-size: 14px; color: var(--fg-2); display: grid; gap: 4px; }
.fact-more span b { font-weight: 600; color: var(--fg); }

/* Competitors */
.comp-list { border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.comp { padding: 16px 18px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 14px; }
.comp:first-child { border-top: 0; }
.comp.you { margin: 8px; border: 1px solid var(--accent-soft); border-radius: 14px; background: linear-gradient(90deg, var(--accent-wash), var(--bg)); }
.comp.you + .comp { border-top: 0; }
.logo-i { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--fg-2); grid-row: span 2; }
.comp.you .logo-i { background: var(--accent); color: var(--on-accent); }
.comp-name { font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.comp-site { font-size: 13px; color: var(--muted); }
.comp-count { text-align: right; font-size: 12px; color: var(--muted); display: grid; gap: 4px; justify-items: end; align-content: start; }
.cc-row { display: flex; gap: 14px; }
.cc { display: grid; justify-items: end; line-height: 1.25; }
.cc b { font-size: 22px; color: var(--fg); font-weight: 700; line-height: 1.1; }
.comp-rec { grid-column: 2 / -1; font-size: 13px; color: var(--accent-ink); font-weight: 500; }
.comp-why { grid-column: 2 / -1; font-size: 14px; color: var(--fg-2); }
.comp-why em { font-style: normal; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.chip { border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; background: var(--bg); color: var(--fg-2); }
.cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 640px) { .cards3 { grid-template-columns: 1fr; } }
.take { background: var(--surface); border-radius: 16px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.take b { font-weight: 600; }
.take p { font-size: 14px; color: var(--fg-2); }

/* How AI describes */
.desc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .desc { grid-template-columns: 1fr; } }
.desc-box { border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.desc-box.owner { background: var(--accent-wash); border-color: var(--accent-soft); }
.desc-box h4 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.desc-line { font-size: 18px; line-height: 1.45; }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.word { font-size: 13px; border-radius: 999px; padding: 4px 10px; background: var(--surface-2); }
.word b { font-weight: 600; margin-left: 4px; color: var(--muted); }
.word.zero { background: var(--bad-wash); color: var(--bad); }
.word.zero b { color: var(--bad); }
.gap-line { font-size: 15px; color: var(--fg-2); }
.rivals { display: grid; gap: 0; border-top: 1px solid var(--line); }
.rival { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 15px; }
@media (max-width: 520px) { .rival { grid-template-columns: 1fr; gap: 2px; } }
.rival b { font-weight: 600; }
.rival span { color: var(--fg-2); }

/* Grid table */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; }
table.grid { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 560px; }
table.grid th, table.grid td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.grid thead th { background: var(--surface); font-size: 12px; font-weight: 600; color: var(--fg-2); }
table.grid tbody tr:last-child td { border-bottom: 0; }
table.grid td.c { text-align: center; }
.tick { color: var(--good); font-weight: 700; }
.cross { color: var(--faint); }
th.you-col, td.you-col { background: var(--accent-wash); }
.small { font-size: 13px; color: var(--muted); }

/* Topics */
.topic { padding-block: 16px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.topic:first-of-type { border-top: 0; padding-top: 0; }
.topic-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.topic-h h3 { font-size: 19px; font-weight: 600; }
.topic-v { text-align: right; font-size: 18px; font-weight: 700; white-space: nowrap; }
.topic-v small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.topic p { font-size: 15px; color: var(--fg-2); }
.topic .src { color: var(--muted); }

/* Source map */
.smap-group { display: grid; gap: 0; }
.smap-group h3 { font-size: 15px; font-weight: 600; padding-bottom: 8px; display: flex; justify-content: space-between; gap: 10px; }
.smap-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1.2fr); gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); font-size: 14px; align-items: start; }
@media (max-width: 560px) { .smap-row { grid-template-columns: minmax(0, 1fr) auto; } .smap-row .act { grid-column: 1 / -1; } }
.smap-row .dom { font-weight: 500; overflow-wrap: anywhere; }
.smap-row .dom small { display: block; color: var(--muted); font-weight: 400; }
.smap-row .act { color: var(--fg-2); }

/* Recommendations */
.recs { display: grid; gap: 14px; }
.rec { background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; grid-template-columns: 34px 1fr; gap: 6px 14px; box-shadow: 0 1px 2px rgba(22,22,29,0.04), 0 8px 24px rgba(83,58,253,0.05); }
.rec-n { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; grid-row: span 4; }
.rec h3 { font-size: 19px; font-weight: 600; line-height: 1.35; }
.rec p { color: var(--fg-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; border: 1px solid var(--line-2); border-radius: 8px; padding: 3px 8px; color: var(--fg-2); background: var(--bg); }
.tag b { font-weight: 600; color: var(--fg); }
.basis { font-size: 13px; color: var(--muted); }
.basis a { color: var(--muted); }

/* Closing */
.plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 640px) { .plan { grid-template-columns: 1fr; } }
.step { border-top: 1px solid var(--ink-line); padding-top: 12px; display: grid; gap: 6px; align-content: start; }
.step .wk { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); letter-spacing: 0.04em; }
.step b { font-weight: 600; }
.step p { font-size: 14px; color: var(--ink-muted) !important; }
.step .dec { font-size: 13px; color: var(--ink-fg); background: #26253a; border-radius: 8px; padding: 6px 8px; }
.closing-text { font-size: 20px; line-height: 1.5; }
.inkcards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .inkcards { grid-template-columns: 1fr; } }
.inkcard { background: #222131; border: 1px solid var(--ink-line); border-radius: 16px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.inkcard h3 { font-size: 17px; font-weight: 600; }
.inkcard p, .inkcard li { font-size: 14px; color: var(--ink-muted) !important; }
.inkcard ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.inkcard .tnum b { color: var(--ink-fg); }

/* Folds */
details.fold { border: 1px solid var(--line); border-radius: 18px; background: var(--bg); }
details.fold > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h3 { font-size: 19px; font-weight: 600; }
details.fold > summary small { display: block; font-size: 14px; color: var(--muted); font-weight: 400; }
details.fold > summary .chev { transition: transform 0.25s var(--ease); flex: none; }
details.fold[open] > summary .chev { transform: rotate(180deg); }
.fold-b { padding: 0 18px 18px; display: grid; gap: 12px; }
.wc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding-block: 12px; border-top: 1px solid var(--line); }
.wc-row:first-child { border-top: 0; }

g"], "sources": [{"title": "Pico Laser untuk Flek Hitam & Bekas Jerawat | Diri Clinic", "url": "https://diricare.com/clinic/treatment/pico-laser", "domain": "diricare.com"}, {"title": "Berapa Biaya Laser Flek Hitam di Klinik Kecantikan dan Ketahanannya?", "url": "https://www.suara.com/lifestyle/2026/10/10/131500/berapa-biaya-laser-flek-hitam-di-klinik-kecantikan-dan-ketahanannya", "domain": "suara.com"}], "answer": "Kalau cari yang **cukup terpercaya dan masih relatif terjangkau di Jakarta**, saya akan shortlist seperti ini:\n\n| Klinik | Treatment untuk flek | Perkiraan harga |\n|---|---|---:|\n| **Diri Clinic – Jakarta Barat** | Pico Pro Laser | mulai **Rp499 ribu** |\n| **RS Royal Progress – Sunter, Jakarta Utara** | Laser Spot Pigment | **Rp599 ribu** — belum termasuk konsultasi |\n| **K Young – Bendungan Hilir, Jakarta Pusat** | D2PL hiperpigmentasi | **Rp650 ribu**; Pico Pigment **Rp1,5 juta** |\n| **Ultima Clinic** | Pico Laser | promo pelanggan baru sekitar **Rp499 ribu**, harga normal sekitar Rp1,199 juta—cek cabang Jakarta dan promo aktif |\n| **Fabella Beauty Clinic – area Depok** | Pigmented Laser | mulai sekitar **Rp899 ribu** untuk member |\n\nHarga bisa berubah karena promo, cabang, luas area, dan hasil pemeriksaan dokter. ([diricare.com](https://diricare.com/clinic/treatment/pico-laser))\n\n### Rekomendasi saya berdasarkan budget\n\n- **Paling hemat:** mulai cek **Diri Clinic** atau **RS Royal Progress**.\n- **Kalau ingin konsultasi dan tindakan di bawah pengawasan dokter:** **K Young** menarik; D2PL-nya lebih murah daripada Pico.\n- **Kalau fleknya berupa melasma atau sudah lama:** jangan langsung memilih laser berdasarkan promo. Sebaiknya konsultasi dulu karena melasma bisa kambuh dan pada sebagian orang laser malah berisiko memperparah pigmentasi.\n- **Kalau hanya bekas jerawat atau flek tipis:** biasanya bisa mulai dari treatment pigmentasi/IPL atau obat oles dokter, yang mungkin lebih murah daripada paket Pico Laser.\n\n### Sebelum booking, tanyakan 5 hal ini\n\n1. Harga sudah termasuk konsultasi dokter atau belum?\n2. Treatment dilakukan dokter atau terapis?\n3. Apakah cocok untuk **melasma**, bukan hanya bekas jerawat?\n4. Perlu berapa sesi dan jaraknya berapa minggu?\n5. Ada biaya tambahan untuk krim aftercare, anestesi, atau membership?\n\nSebagai patokan, perawatan laser flek sering membutuhkan beberapa sesi; hasilnya juga sangat bergantung pada jenis dan kedalaman pigmentasi. Perlindungan matahari tetap wajib, karena hasil laser tidak otomatis permanen. ([suara.com](https://www.suara.com/lifestyle/2026/10/10/131500/berapa-biaya-laser-flek-hitam-di-klinik-kecantikan-dan-ketahanannya))\n\n**Pilihan praktis saya:** mulai dari konsultasi **RS Royal Progress atau K Young**, lalu bandingkan dengan promo **Diri Clinic**. Jangan membeli paket banyak sesi sebelum melihat bagaimana kulit merespons satu sesi pertama."}, "google": {"status": "notasked"}}, {"n": 2, "topic": "Bekas jerawat", "q": "Rekomendasi klinik untuk menghilangkan bekas jerawat di Jakarta Selatan, kisaran harganya berapa?", "ai_mentions": 1146, "chatgpt": {"status": "none", "named": ["Primavita Clinic", "ERHA", "Aveia Health Skin Clinic", "NMW Aesthetic Clinic", "Farla Infinite", "Amala Clinic"], "rec": ["Primavita Clinic", "ERHA", "Aveia Health Skin Clinic", "NMW Aesthetic Clinic", "Amala Clinic"], "sources": [{"title": "Scar Treatment – Primavita Clinic", "url": "https://primavitaclinic.co.id/face/scar-treatment/", "domain": "primavitaclinic.co.id"}, {"title": "ERHA Ultimate - Klinik Spesialis Kulit & Rambut", "url": "https://erhaultimate.co.id/id/treatment-group/microneedle", "domain": "erhaultimate.co.id"}, {"title": "paket-bekas-luka | Aveia Health Skin Clinic Jakarta", "url": "https://www.aveiaclinic.com/id/paket-bekas-luka", "domain": "aveiaclinic.com"}, {"title": "Advance Scar Correction Theraphy | Official NMW Aesthetic Clinic & Dermatologi Jakarta", "url": "https://nmwclinic.co.id/layanan/medical-treatment/advance-scar-correction-theraphy", "domain": "nmwclinic.co.id"}, {"title": "Skin Texture | Farla Aesthetic Clinic Jakarta", "url": "https://farla.id/treatment/skin-texture-treatment-farla/", "domain": "farla.id"}, {"title": "Amala Clinic", "url": "https://amalaclinic.com/treatment/pigment-and-texture", "domain": "amalaclinic.com"}], "answer": "Kalau di **Jakarta Selatan**, saya akan mempertimbangkan klinik berikut—terutama bila bekas jerawatnya berupa **bopeng/tekstur**, bukan hanya noda hitam:\n\n| Klinik | Lokasi | Treatment yang relevan | Kisaran harga yang dipublikasikan |\n|---|---|---|---:|\n| **Primavita Clinic** | Tebet | Dermalpunch/microneedling, chemical peeling, filler | Dermalpunch mulai **Rp1 juta**; peeling **Rp500–550 ribu**; filler mulai **Rp2,5 juta** ([primavitaclinic.co.id](https://primavitaclinic.co.id/face/scar-treatment/)) |\n| **ERHA Ultimate** | SCBD, Jakarta Selatan | Microneedling, EPN/Dermapen, scar treatment | Mulai sekitar **Rp1,385 juta**; treatment DNA Salmon mulai **Rp3,525 juta** ([erhaultimate.co.id](https://erhaultimate.co.id/id/treatment-group/microneedle)) |\n| **Aveia Health Skin Clinic** | Mampang | Peeling dan laser untuk bekas luka/tekstur | Sekitar **Rp570 ribu–Rp2,45 juta**, tergantung kombinasi laser, peeling, obat, dan area ([aveiaclinic.com](https://www.aveiaclinic.com/id/paket-bekas-luka)) |\n| **NMW Aesthetic Clinic** | Petogogan | Advance scar correction, subsisi/PRP sesuai evaluasi | Harga perlu dikonfirmasi saat konsultasi; klinik menyediakan terapi khusus bekas jerawat cekung ([nmwclinic.co.id](https://nmwclinic.co.id/layanan/medical-treatment/advance-scar-correction-theraphy)) |\n| **Farla Infinite** | Cilandak | CO₂ laser, RF microneedling, scar treatment | Harga tidak tercantum jelas di halaman treatment; perlu tanya paket dan dokter yang menangani ([farla.id](https://farla.id/treatment/skin-texture-treatment-farla/)) |\n| **Amala Clinic** | Jakarta Selatan | Laser skin resurfacing untuk tekstur dan bopeng | Mulai sekitar **Rp3,8 juta** ([amalaclinic.com](https://amalaclinic.com/treatment/pigment-and-texture)) |\n\n### Perkiraan budget realistis\n\n- **Noda hitam/kemerahan bekas jerawat:** sekitar **Rp300 ribu–Rp1,5 juta per sesi**, biasanya peeling, IPL, atau laser pigment.\n- **Tekstur ringan dan pori:** sekitar **Rp1–2,5 juta per sesi**, misalnya microneedling atau fractional laser.\n- **Bopeng sedang–dalam:** sekitar **Rp2–5 juta per sesi**, terutama bila perlu kombinasi **subcision, fractional CO₂, microneedling RF, PRP, atau filler**.\n- Untuk hasil yang terlihat, sering kali perlu **beberapa sesi**, jadi total program bisa sekitar **Rp4–15 juta atau lebih**, tergantung kedalaman bopeng dan metode yang dipilih.\n\n### Rekomendasi saya\n\n- **Budget lebih terukur:** Primavita Tebet atau Aveia Mampang.\n- **Ingin konsultasi di jaringan spesialis kulit yang lebih besar:** ERHA Ultimate SCBD.\n- **Bopeng dalam/rolling scar:** pilih klinik yang dapat mengevaluasi **subcision**, bukan langsung menawarkan facial atau laser saja. NMW bisa dipertimbangkan.\n- **Ingin laser resurfacing yang lebih intensif:** Amala atau klinik dermatologi yang menyediakan fractional CO₂.\n\nSebaiknya konsultasi dulu dan tanyakan secara spesifik: **biaya konsultasi, biaya anestesi, obat pascatindakan, pajak, downtime, jumlah sesi, serta apakah tindakan dikerjakan dokter kulit atau terapis**. Jika masih ada jerawat aktif, biasanya jerawatnya perlu dikendalikan dulu agar bekas baru tidak terus muncul."}, "google": {"status": "notasked"}}, {"n": 3, "topic": "Filler dan botox", "q": "Mau coba filler atau botox pertama kali, klinik mana yang aman dan terpercaya di Jakarta?", "chatgpt": {"status": "none", "named": ["RSUD Pasar Minggu", "RSUD Budhi Asih", "C Derma", "Bamed Clinic"], "rec": ["RSUD Pasar Minggu", "RSUD Budhi Asih", "C Derma", "Bamed Clinic"], "sources": [{"title": "KLINIK KULIT & KELAMIN Poliklinik | RSUD Pasar Minggu - Rumah Sehat Untuk Jakarta", "url": "https://rsudpasarminggu.jakarta.go.id/poliklinik/detail/klinik-kulit-kelamin", "domain": "rsudpasarminggu.jakarta.go.id"}, {"title": "Rawat Jalan", "url": "https://rsudbudhiasih.jakarta.go.id/website/Layanan_Kesehatan/Rawat_Jalan?kd=MjQ4OQ%3D%3D", "domain": "rsudbudhiasih.jakarta.go.id"}, {"title": "C Derma - Dermatology & Aesthetic Center", "url": "https://www.cderma.id/", "domain": "cderma.id"}, {"title": "dr. Sonia Hanifati - Klinik Bamed", "url": "https://klinikbamed.com/dokter/sonia-hanifati/", "domain": "klinikbamed.com"}, {"title": "Cari Dermatologist — PERDOSKI", "url": "https://perdoski.id/id/find-doctor", "domain": "perdoski.id"}, {"title": "Perhimpunan Dokter Spesialis", "url": "https://perdoski.id/uploads/original/2017/09/PanduanKeterampilanKlinisPERDOSKI2017.pdf", "domain": "perdoski.id"}], "answer": "Kalau **pertama kali**, saya akan lebih memilih **klinik/RS yang injeksinya dilakukan langsung oleh dokter spesialis Dermatologi dan Venereologi (Sp.DV/Sp.DVE)**—bukan sekadar klinik yang menawarkan promo murah.\n\n### Shortlist yang relatif aman untuk dipertimbangkan di Jakarta\n\n1. **Klinik Kulit & Kelamin RSUD Pasar Minggu** — Jakarta Selatan  \n   Layanan ditangani dokter spesialis Dermatologi dan Venereologi; cocok bila Anda ingin mulai dari konsultasi medis yang lebih konservatif. ([rsudpasarminggu.jakarta.go.id](https://rsudpasarminggu.jakarta.go.id/poliklinik/detail/klinik-kulit-kelamin))\n\n2. **Klinik Kulit & Kelamin RSUD Budhi Asih** — Jakarta Timur  \n   Secara resmi mencantumkan layanan injeksi Botox dan filler oleh tim dokter spesialis. ([rsudbudhiasih.jakarta.go.id](https://rsudbudhiasih.jakarta.go.id/website/Layanan_Kesehatan/Rawat_Jalan?kd=MjQ4OQ%3D%3D))\n\n3. **C Derma Dermatology & Aesthetic Center** — Jakarta  \n   Menawarkan filler dan botox serta menyatakan tindakan ditangani dokter spesialis kulit, kelamin, dan estetika. ([cderma.id](https://www.cderma.id/))\n\n4. **Bamed Clinic**  \n   Pilih cabang/dokter yang memang memiliki kompetensi injeksi. Contohnya, profil dr. Sonia Hanifati mencantumkan pendidikan spesialis dari UI, keanggotaan PERDOSKI, serta pengalaman botulinum toxin dan filler. ([klinikbamed.com](https://klinikbamed.com/dokter/sonia-hanifati/))\n\n5. **Cari dokter melalui direktori PERDOSKI**  \n   Ini cara paling aman untuk memverifikasi dokter Sp.KK/Sp.DV/Sp.DVE di Jakarta sebelum booking. ([perdoski.id](https://perdoski.id/id/find-doctor))\n\n### Checklist wajib sebelum tindakan\n\nTanyakan langsung:\n\n- **Siapa dokternya dan nomor SIP-nya?** Verifikasi gelar dan profilnya di PERDOSKI/IDI.\n- Produk apa yang dipakai, **merek, tipe, nomor registrasi BPOM, dan tanggal kedaluwarsa**?\n- Untuk filler: apakah **hyaluronic acid yang bisa dilarutkan dengan hyaluronidase**? Untuk pemula, biasanya lebih masuk akal dibanding filler permanen.\n- Apakah kemasan dibuka di depan Anda dan sisa produk diberikan/ditunjukkan?\n- Apakah klinik memiliki protokol menangani komplikasi pembuluh darah, termasuk **hyaluronidase** dan rujukan ke rumah sakit?\n- Siapa yang menyuntik—dokter yang konsultasi atau “terapis”?\n\n### Saran saya untuk tindakan pertama\n\n- Bila masih ragu, mulai dari **konsultasi saja**, jangan langsung mengambil paket.\n- Untuk risiko dan reversibilitas, **botox biasanya lebih sederhana daripada filler**, tetapi tetap bukan tanpa risiko.\n- Hindari promo ekstrem, filler permanen, suntik di salon, atau tindakan yang dilakukan tanpa konsultasi dokter.\n- Jangan lakukan filler bila sedang ada infeksi/jerawat meradang di area suntikan, sedang hamil/menyusui tanpa persetujuan dokter, atau memiliki riwayat alergi/penyakit tertentu tanpa memberi tahu dokter. Pedoman PERDOSKI mencantumkan pembengkakan, memar, alergi, dan komplikasi lain sebagai risiko yang perlu dibahas sebelum filler. ([perdoski.id](https://perdoski.id/uploads/original/2017/09/PanduanKeterampilanKlinisPERDOSKI2017.pdf))\n\n**Pilihan praktis saya:** untuk pemula, mulai dengan konsultasi di **RSUD Pasar Minggu/Budhi Asih** bila ingin pendekatan rumah sakit dan biaya cenderung lebih terkontrol; atau **C Derma/Bamed** bila ingin klinik estetika dengan dokter spesialis. Pastikan memilih **dokter tertentu**, bukan hanya nama kliniknya."}, "google": {"status": "notasked"}}, {"n": 4, "topic": "Klinik dengan banyak cabang", "q": "Klinik kecantikan yang cabangnya banyak dan harganya terjangkau di Indonesia apa saja?", "chatgpt": {"status": "recommended", "named": ["SuperSkin Clinic", "Naavagreen", "Larissa Aesthetic Center", "Natasha Skin Clinic", "ZAP Clinic", "ERHA"], "rec": ["SuperSkin Clinic", "Naavagreen", "Larissa Aesthetic Center", "Natasha Skin Clinic", "ZAP Clinic", "ERHA"], "sources": [{"title": "Ultima Clinic - Klinik Kecantikan Terdekat, Harga Terjangkau", "url": "", "domain": "ultimaclinic.cloudindo.example"}, {"title": "Klinik Kecantikan Terbaik | Superskin Skincare & Treatment", "url": "https://superskinme.id/id", "domain": "superskinme.id"}, {"title": "Rekomendasi Klinik Kecantikan di Indonesia - Traveloka", "url": "https://www.traveloka.com/id-id/activities/indonesia/country/indonesia-100003/beauty-and-spa/beauty-clinic", "domain": "traveloka.com"}, {"title": "7 Klinik Kecantikan dengan Cabang Terbanyak - Aplikasi Absensi Online Karyawan", "url": "https://www.hadirr.com/blog/klinik-kecantikan-dengan-cabang-terbanyak/", "domain": "hadirr.com"}, {"title": "Ultima Clinic - Klinik Kecantikan Terdekat, Harga Terjangkau", "url": "", "domain": "ultimaclinic.example"}], "answer": "Kalau kriterianya **cabang banyak + relatif terjangkau**, beberapa pilihan yang bisa dipertimbangkan di Indonesia:\n\n| Klinik | Perkiraan posisi harga | Kelebihan |\n|---|---|---|\n| **Ultima Clinic** | Mulai sekitar **Rp199 ribuan** untuk promo/treatment tertentu | Cabang cukup luas, lebih dari 70 cabang menurut situsnya, termasuk di luar Jawa; sering menawarkan promo. (ultimaclinic.cloudindo.example) |\n| **SuperSkin Clinic** | Cenderung ekonomis, sering ada promo facial/peeling | Memiliki sekitar **22 cabang di Pulau Jawa** dan kerap menawarkan promo tebus murah atau facial gratis bersyarat. ([superskinme.id](https://superskinme.id/id)) |\n| **Naavagreen Natural Skin Care** | Umumnya termasuk budget-friendly | Banyak dikenal di kota-kota Jawa dan beberapa kota luar Jawa; cocok untuk facial, perawatan jerawat, dan produk skincare rutin. |\n| **Larissa Aesthetic Center** | Relatif terjangkau, terutama produk dan facial dasar | Jaringan kuat di Pulau Jawa; pilihan populer untuk perawatan rutin dengan biaya lebih rendah dibanding klinik estetika premium. |\n| **Natasha Skin Clinic** | Menengah dan sering ada paket perawatan | Salah satu jaringan lama dengan banyak cabang di berbagai kota; cocok bila ingin konsultasi dan produk yang terstandardisasi. |\n| **ZAP Clinic** | Menengah; promo tertentu cukup terjangkau | Jaringan besar dan pilihan treatment luas, terutama laser, hair removal, dan perawatan kulit. Namun beberapa treatment bisa cukup mahal—contoh harga di marketplace dapat mencapai jutaan rupiah, jadi perlu cek treatment spesifik. ([traveloka.com](https://www.traveloka.com/id-id/activities/indonesia/country/indonesia-100003/beauty-and-spa/beauty-clinic)) |\n| **ERHA** | Menengah hingga premium | Cabangnya banyak dan lebih kuat untuk masalah dermatologi seperti jerawat, flek, dermatitis, dan rambut rontok; biasanya tidak semurah klinik facial umum. Sumber pihak ketiga menyebut ERHA memiliki lebih dari 100 cabang. ([hadirr.com](https://www.hadirr.com/blog/klinik-kecantikan-dengan-cabang-terbanyak/)) |\n\n### Kalau ingin yang paling hemat\n\n- **Facial atau perawatan dasar:** coba bandingkan **Naavagreen, Larissa, SuperSkin, atau Ultima**.\n- **Jerawat yang cukup berat, flek, atau masalah kulit berulang:** pertimbangkan **ERHA, Natasha, atau ZAP**, tetapi jangan hanya memilih berdasarkan promo.\n- **Laser atau hair removal:** biasanya **ZAP dan Ultima** lebih mudah ditemukan di kota-kota besar.\n- **Di luar Pulau Jawa:** **Ultima** bisa menjadi salah satu pilihan yang lebih mudah dicari karena jaringannya mencakup Medan, Makassar, dan kota besar lainnya. (ultimaclinic.example)\n\n**Catatan penting:** harga sangat bergantung pada kota, dokter, jenis treatment, dan promo. Harga mulai Rp100–200 ribuan biasanya hanya untuk facial, konsultasi, peeling ringan, atau promo pertama—bukan total biaya rangkaian perawatan. Sebaiknya cek dulu apakah harga sudah termasuk konsultasi dokter, obat, anestesi, pajak, dan biaya produk pulang.\n\nKalau ingin pilihan paling aman untuk mulai, ambil **konsultasi atau facial dasar satu kali dulu**, jangan langsung membeli paket mahal."}, "google": {"status": "notasked"}}, {"n": 5, "topic": "Nama klinik: bagus dan aman?", "q": "Ultima Clinic bagus nggak? Aman dan worth it untuk treatment wajah?", "brand": true, "brand_summary": "ChatGPT menilai Ultima “cukup oke” untuk facial dan perawatan dasar dengan harga promo, mengutip rating dan ulasan dari CariBisnis, lalu menyarankan dokter spesialis untuk kasus berat.", "chatgpt": {"status": "mentioned", "named": [], "rec": [], "sources": [{"title": "Tentang Kami - Ultima Clinic | 75+ Cabang di Indonesia", "url": "", "domain": "ultimaclinic.example"}, {"title": "Ultima Clinic - Kelapa Gading 2: 222 Ulasan, Rating 4.7★ — Kelapa Gading, Jakarta Utara | CariBisnis.id", "url": "", "domain": "caribisnis.id"}, {"title": "Ultima Clinic - Tebet Timur | Klinik Kecantikan Terbaik untuk Kulit, Rambut, dan Slimming: 137 Ulasan, Rating 4.8★ — Tebet, Jakarta Selatan | CariBisnis.id", "url": "", "domain": "caribisnis.id"}], "answer": "**Jawaban singkat:** Ultima Clinic *bisa jadi pilihan yang cukup oke*, terutama untuk facial/basic treatment dengan harga promo. Tapi saya tidak akan langsung menyebut semua cabangnya “pasti aman” atau selalu worth it, karena kualitas layanan tampaknya bisa berbeda antar cabang dan dokter.\n\n**Yang terlihat positif:**\n- Ultima mengklaim memiliki banyak cabang dan prosedur di bawah pengawasan dokter, memakai alat bersertifikasi serta produk yang terdaftar BPOM—namun klaim ini tetap sebaiknya dikonfirmasi langsung di cabang. (ultimaclinic.example)\n- Beberapa cabang punya rating publik tinggi, misalnya Kelapa Gading sekitar 4,7/5 dari 222 ulasan, Tebet 4,8/5 dari 137 ulasan, dan Rawamangun 9,5/10 dari 57 ulasan Traveloka. (caribisnis.id)\n- Banyak ulasan memuji keramahan dokter/terapis, kebersihan, dan harga yang relatif terjangkau. (caribisnis.id)\n\n**Hal yang perlu diwaspadai:**\n- Ada ulasan mengenai antrean, miskomunikasi appointment, hasil treatment yang tidak sesuai harapan, serta promo atau harga yang kurang transparan. (caribisnis.id)\n- Rating Google/Traveloka lebih banyak menggambarkan pengalaman layanan, **bukan bukti medis bahwa treatment pasti efektif atau cocok untuk kulitmu**.\n- Untuk tindakan seperti **laser, peeling kuat, microneedling, IPL, HIFU, filler, botox, atau suntik**, keamanan sangat bergantung pada diagnosis, dokter yang menangani, alat, dosis, dan aftercare—bukan hanya nama kliniknya.\n\n**Menurut saya, worth it kalau:**\n- Tujuannya facial, cleansing, hidrasi, atau perawatan ringan.\n- Kamu sudah tahu treatment yang dibutuhkan dan mendapat rincian harga tertulis.\n- Konsultasi dilakukan oleh dokter yang menjelaskan manfaat, risiko, jumlah sesi, dan alternatif—bukan langsung didorong membeli paket.\n- Kamu memilih cabang dengan ulasan terbaru yang konsisten dan tidak hanya mengandalkan promo.\n\n**Sebelum treatment, tanyakan ini:**\n1. “Dokternya siapa dan apakah dokter yang melakukan/menyetujui tindakan?”\n2. “Alat dan produk yang dipakai apa? Bisa lihat nomor izin edar/registrasinya?”\n3. “Total biaya sudah termasuk konsultasi, anestesi, obat, pajak, dan kontrol atau belum?”\n4. “Efek samping dan downtime-nya berapa lama?”\n5. “Kalau terjadi iritasi atau komplikasi, follow-up-nya bagaimana?”\n6. Jangan langsung mengambil paket besar pada kunjungan pertama.\n\n**Kesimpulan:**  \nUntuk **facial/basic skincare**, Ultima kemungkinan cukup layak dicoba, tetapi pilih cabang dan dokter dengan hati-hati. Untuk **jerawat berat, flek membandel, bopeng, pigmentasi, atau tindakan invasif**, saya lebih menyarankan konsultasi ke **dokter spesialis kulit dan kelamin (Sp.D.V.E.)** atau klinik yang transparan soal dokter dan alatnya. Datang untuk konsultasi dulu, bukan langsung membeli paket."}, "google": {"status": "notasked"}}, {"n": 6, "topic": "Klinik terdekat", "q": "Klinik kecantikan terdekat", "volume": 49500, "google": {"status": "failed", "named": [], "rec": [], "sources": [], "answer": "", "note": "Google menandai ada AI Overview untuk pertanyaan ini, tetapi teksnya tidak tersimpan dalam data uji, jadi hasilnya tidak dapat dinilai.", "label": "Tidak dapat dinilai"}, "chatgpt": {"status": "notasked"}}, {"n": 7, "topic": "Klinik kecantikan terbaik", "q": "Apa klinik kecantikan terbaik di indonesia", "ai_mentions": 299, "google": {"status": "cited", "named": ["ZAP Clinic", "Dermaster", "ERHA", "Bening's Clinic", "Jakarta Aesthetic Clinic", "Miracle Aesthetic Clinic"], "rec": ["ZAP Clinic", "Dermaster", "ERHA", "Bening's Clinic", "Jakarta Aesthetic Clinic", "Miracle Aesthetic Clinic"], "sources": [{"title": "7 Klinik Kecantikan dengan Cabang Terbanyak - Aplikasi Absensi Online Karyawan", "url": "https://www.hadirr.com/blog/klinik-kecantikan-dengan-cabang-terbanyak/", "domain": "hadirr.com"}, {"title": "Rekomendasi Klinik Kecantikan Terbaik di Indonesia - Indopos", "url": "https://koranindopos.com/rekomendasi-klinik-kecantikan-terbaik-di-indonesia/", "domain": "koranindopos.com"}, {"title": "Klinik Kecantikan & Estetika Terbaik di Jakarta - Blink Beauty Clinic", "url": "https://blinkbeautyclinic.com/id/", "domain": "blinkbeautyclinic.com"}, {"title": "5 Rekomendasi Klinik Kecantikan Terpercaya dan Terbaik", "url": "https://wartaevent.com/5-rekomendasi-klinik-kecantikan-terpercaya-dan-terbaik/", "domain": "wartaevent.com"}, {"title": "7 Rekomendasi Klinik Kecantikan Terbaik yang Bagus & Layanannya", "url": "", "domain": "ultimaclinic.example"}, {"title": "5 Rekomendasi Klinik Kecantikan dengan Perawatan Paling Lengkap ...", "url": "https://www.suara.com/lifestyle/2023/11/10/082753/5-rekomendasi-klinik-kecantikan-dengan-perawatan-paling-lengkap-cocok-buat-self-reward", "domain": "suara.com"}, {"title": "Harga Facial Wajah 2026 & Jenis Perawatannya di C Derma", "url": "https://www.cderma.id/harga-facial-wajah/", "domain": "cderma.id"}], "answer": "Tidak ada satu klinik kecantikan tunggal yang dinobatkan sebagai yang terbaik di Indonesia karena pilihannya bergantung pada kebutuhan kulit, anggaran, dan lokasi Anda . Namun, beberapa klinik kecantikan terkemuka dan populer di Indonesia meliputi:\n\n### Rekomendasi Klinik Kecantikan Populer di Indonesia\n\n- **ZAP Clinic** \n\t- **Keahlian:** Perawatan penghilangan bulu (*hair removal* ) dan peremajaan kulit berbasis laser dengan teknologi modern.\n\t- **Jaringan:** Memiliki lebih dari 60 cabang yang tersebar di berbagai kota di Indonesia.[[1]](https://www.hadirr.com/blog/klinik-kecantikan-dengan-cabang-terbanyak/)[[2]](https://koranindopos.com/rekomendasi-klinik-kecantikan-terbaik-di-indonesia/)\n- **Dermaster Klinik Indonesia** \n\t- **Keahlian:** Perawatan kontur wajah (*contouring* ), tanam benang (*thread lift* ), dan *skin tightening* tanpa operasi (berasal dari Korea).\n\t- **Jaringan:** Memiliki belasan cabang utama dan telah meraih berbagai penghargaan estetika.[[1]](https://blinkbeautyclinic.com/id/)[[2]](https://www.hadirr.com/blog/klinik-kecantikan-dengan-cabang-terbanyak/)[[3]](https://wartaevent.com/5-rekomendasi-klinik-kecantikan-terpercaya-dan-terbaik/)\n- **ERHA Clinic** \n\t- **Keahlian:** Dermatologi klinis lengkap, penanganan jerawat, flek hitam, serta perawatan rambut oleh dokter spesialis kulit (Sp.KK / Sp.D.V.E).\n\t- **Jaringan:** Memiliki lebih dari 100 cabang di Indonesia.[[1]](https://www.hadirr.com/blog/klinik-kecantikan-dengan-cabang-terbanyak/)\n- **Bening's Clinic** \n\t- **Keahlian:** Perawatan *glow*, *laser* , dan produk *skincare* racikan dokter.\n\t- **Jaringan:** Memiliki puluhan cabang (lebih dari 66 cabang) di berbagai daerah.[[1]](https://www.hadirr.com/blog/klinik-kecantikan-dengan-cabang-terbanyak/)\n- **Jakarta Aesthetic Clinic (JAC)** \n\t- **Keahlian:** Perawatan anti-aging, *botox*, *filler* , dan kontur wajah tanpa bedah yang dipimpin oleh dr. Olivia Ong.[[1]][[2]](https://www.suara.com/lifestyle/2023/11/10/082753/5-rekomendasi-klinik-kecantikan-dengan-perawatan-paling-lengkap-cocok-buat-self-reward)\n- **Miracle Aesthetic Clinic** \n\t- **Keahlian:** Konsep *facial reshaping* dan perawatan holistik wajah yang sudah beroperasi sejak tahun 1996.[[1]](https://www.hadirr.com/blog/klinik-kecantikan-dengan-cabang-terbanyak/)\n\n### Tips Memilih Klinik Kecantikan\n\n- **Cek Legalitas & Dokter:** Pastikan klinik memiliki izin resmi Kementerian Kesehatan dan ditangani oleh dokter umum bersertifikat estetika atau dokter spesialis kulit (Sp.D.V.E).\n- **Sesuaikan dengan Masalah Kulit:** Pilih klinik yang fokus pada masalah spesifik Anda (misalnya jerawat ke dokter kulit seperti ERHA, atau *contouring* dan *anti-aging* ke Dermaster atau JAC).\n- **Perkiraan Biaya:** Biaya perawatan dasar seperti *facial* di klinik umumnya berkisar mulai dari **Rp150.000 hingga Rp5.000.000 per sesi** , tergantung jenis tindakan dan reputasi klinik.[[1]](https://www.cderma.id/harga-facial-wajah/)\n\nJika Anda mau berbagi **jenis masalah kulit yang ingin diatasi** (misalnya jerawat, kusam, atau anti-penuaan) serta **kota tempat tinggal Anda** , saya bisa memberikan rekomendasi klinik yang paling sesuai."}, "chatgpt": {"status": "notasked"}}, {"n": 8, "topic": "Biaya laser flek hitam", "q": "Berapa biaya laser untuk menghilangkan flek hitam di wajah", "google": {"status": "cited", "named": ["Bening's Clinic", "ZAP Clinic", "ERHA"], "rec": [], "sources": [{"title": "\"\"PEJUANG MELASMA WAJIB MERAPAT 😭🔥 Ini bukan treatment ...", "url": "https://www.instagram.com/reel/DWXyK4HEqol/", "domain": "instagram.com"}, {"title": "Biaya Laser Wajah 2026: Semua Jenis Lase o Yellow Laser / Nd:YAG:** Mulai dari **Rp1.500.000 hingga Rp1.800.000** per sesi.\n- **Kombinasi Paket Premium (seperti Yellow Laser + Xela Rederm):** Sekitar **Rp4.000.000** (harga promo).[[1]](https://www.instagram.com/p/CqVQrJ4rP0J/)[[2]](https://www.instagram.com/reel/DADeocnTwOc/)[[3]](https://erhaultimate.co.id/article/skincare-tidak-cukup-coba-treatment-laser-bekas-jerawat-proses-jenis-harga-hasilnya)[[4]](https://www.instagram.com/reel/DWXyK4HEqol/)\n\n### Faktor yang Mempengaruhi Biaya\n\n- **Jenis Laser:** Pico laser, Nd:YAG, Fractional CO2, atau Yellow laser memiliki harga dan kegunaan yang berbeda.\n- **Jumlah Sesi:** Sebagian besar masalah flek hitam atau melasma membutuhkan **2 hingga 5 kali sesi** perawatan agar hasilnya maksimal.\n- **Lokasi dan Reputasi Klinik:** Klinik di kota besar atau pusat perbelanjaan biasanya menetapkan tarif lebih tinggi.[[1]](https://hdmall.id/c/menghilangkan-flek-hitam-dengan-laser)[[2]](https://ristraclinic.co.id/blog/laser-untuk-bekas-jerawat-manfaat-treatment-dan-biaya)[[3]](https://erhaultimate.co.id/article/skincare-tidak-cukup-coba-treatment-laser-bekas-jerawat-proses-jenis-harga-hasilnya)[[4]]\n\nJika Anda ingin mempersempit pilihan, beri tahu saya:\n\n- **Jenis flek** yang Anda alami (apakah flek biasa, bekas jerawat, atau melasma/flek hormonal)?\n- Di **kota mana** Anda tinggal?\n\nSaya bisa membantu merekomendasikan jenis laser atau kisaran harga yang lebih spesifik."}, "chatgpt": {"status": "notasked"}}, {"n": 9, "topic": "Bekas jerawat di klinik", "q": "Cara menghilangkan bekas jerawat di klinik kecantikan", "google": {"status": "none", "named": ["ERHA"], "rec": [], "sources": [{"title": "6 Cara Menghilangkan Bekas Jerawat dengan Perawatan Medis - Alodokter", "url": "https://www.alodokter.com/6-cara-menghilangkan-bekas-jerawat-dengan-perawatan-medis", "domain": "alodokter.com"}, {"title": "Skincare Tidak Cukup? Coba Laser untuk Bekas Jerawat", "url": "https://erhaultimate.co.id/article/skincare-tidak-cukup-coba-treatment-laser-bekas-jerawat-proses-jenis-harga-hasilnya", "domain": "erhaultimate.co.id"}, {"title": "Masih belum temukan cara cepat hilangkan bekas jerawat ...", "url": "https://www.instagram.com/reel/DQ1hZAtk1SR/", "domain": "instagram.com"}, {"title": "Beragam Cara Menghilangkan Bekas Jerawat", "url": "https://www.youtube.com/watch?v=bDBQBPeLkZg&t=108", "domain": "youtube.com"}, {"title": "Menghilangkan Bekas Jerawat, Ini 6 Metode yang Efektif - Alodokter", "url": "https://www.alodokter.com/sederet-cara-menghilangkan-bekas-jerawat", "domain": "alodokter.com"}], "answer": "Bekas jerawat di klinik kecantikan diatasi berdasarkan jenisnya melalui prosedur medis yang dilakukan oleh dokter kulit atau estetika profesional.[[1]](https://www.alodokter.com/6-cara-menghilangkan-bekas-jerawat-dengan-perawatan-medis)[[2]](https://erhaultimate.co.id/article/skincare-tidak-cukup-coba-treatment-laser-bekas-jerawat-proses-jenis-harga-hasilnya)\n\n### Jenis Perawatan di Klinik Berdasarkan Masalah Kulit\n\n- **Bekas Jerawat Hitam (PIH) / Kemerahan (PIE)** \n\t- **Pico Laser / PicoWay:** Memecah pigmen melanin yang gelap atau menargetkan pembuluh darah halus untuk meratakan warna kulit dengan minim rasa sakit (*downtime* singkat).\n\t- **Chemical Peeling:** Menggunakan cairan asam khusus untuk mengelupas sel kulit mati dan mencerahkan noda.\n\t- **IPL (Intense Pulsed Light):** Menggunakan gelombang cahaya untuk meratakan warna kulit dan mengurangi kemerahan.[[1]](https://erhaultimate.co.id/article/skincare-tidak-cukup-coba-treatment-laser-bekas-jerawat-proses-jenis-harga-hasilnya)[[2]](https://www.instagram.com/reel/DQ1hZAtk1SR/)[[3]](https://www.alodokter.com/6-cara-menghilangkan-bekas-jerawat-dengan-perawatan-medis)[[4]](https://www.youtube.com/watch?v=bDBQBPeLkZg&t=108)\n- **Bekas Jerawat Bopeng / Tekstur Tidak Rata (Ice-pick, Rolling, Boxcar)** \n\t- **Fractional CO2 Laser:** Membuat mikroluka terkontrol untuk merangsang produksi kolagen baru dan menghaluskan tekstur kulit.\n\t- **Subcision:** Memotong jaringan parut di bawah kulit yang menarik permukaan kulit ke bawah agar bopeng terangkat.\n\t- **Filler Injection:** Menyuntikkan bahan pengisi ke dalam cekungan bopeng untuk meratakannya secara instan (bertahan 6–18 bulan atau permanen).\n\t- **PRP (Platelet-Rich Plasma):** Memanfaatkan plasma darah pasien sendiri yang digabung dengan *microneedling* untuk mempercepat regenerasi sel dan kolagen.\n\t- **Mikrodermabrasi / Dermabrasi:** Mengikis lapisan atas kulit untuk menyamarkan jaringan parut ringan hingga sedang.[[1]](https://www.alodokter.com/sederet-cara-menghilangkan-bekas-jerawat)[[2]](https://erhaultimate.co.id/article/skincare-tidak-cukup-coba-treatment-laser-bekas-jerawat-proses-jenis-harga-hasilnya)[[3]](https://www.alodokter.com/6-cara-menghilangkan-bekas-jerawat-dengan-perawatan-medis)\n\n### Tahapan Umum di Klinik\n\n1. **Konsultasi & Analisis:** Dokter memeriksa jenis bekas jerawat (apakah noda hitam, kemerahan, atau bopeng) serta kondisi *skin barrier*.\n2. **Pembersihan Wajah:** Wajah dibersihkan dari kotoran, minyak, atau sisa *skincare*.\n3. **Anestesi (Opsional):** Pemberian krim anestesi pada tindakan yang cukup intens seperti *Fractional CO2* atau *subcision*.\n4. **Eksekusi Tindakan:** Proses penembakan laser, *peeling* , atau penyuntikan sesuai rencana.\n5. **Soothing & Aftercare:** Pemberian gel pendingin/masker, lalu pasien wajib mengikuti aturan pemulihan seperti memakai *sunscreen* ketat dan menghindari *skincare* aktif sementara waktu.[[1]](https://erhaultimate.co.id/article/skincare-tidak-cukup-coba-treatment-laser-bekas-jerawat-proses-jenis-harga-hasilnya)\n\n### Estimasi Biaya Umum (Di Indonesia)\n\n- **Chemical Peeling / Mikrodermabrasi:** Mulai dari ratusan ribu rupiah.\n- **Laser (Pico Laser, Fractional CO2, Pro Yellow):** Berkisar Rp1.100.000 hingga Rp2.000.000+ per sesi (tergantung klinik dan teknologi).\n- *Catatan:* Sebagian besar tindakan medis memerlukan **lebih dari 1 sesi** untuk hasil yang optimal. Anda dapat membaca lebih lanjut mengenai pilihan prosedurnya melalui panduan [Alodokter](https://www.alodokter.com/6-cara-menghilangkan-bekas-jerawat-dengan-perawatan-medis) atau rincian layanan di [ERHA Ultimate](https://erhaultimate.co.id/article/skincare-tidak-cukup-coba-treatment-laser-bekas-jerawat-proses-jenis-harga-hasilnya).[[1]](https://erhaultimate.co.id/article/skincare-tidak-cukup-coba-treatment-laser-bekas-jerawat-proses-jenis-harga-hasilnya)[[2]](https://www.alodokter.com/6-cara-menghilangkan-bekas-jerawat-dengan-perawatan-medis)\n\nUntuk membantu mengarahkan jenis perawatan yang paling cocok, apakah bekas jerawat Anda berupa **noda hitam/merah** atau **bopeng (cekungan)**?"}, "chatgpt": {"status": "notasked"}}, {"n": 10, "topic": "Nama klinik: harga", "q": "Berapa biaya treatment di ultima", "brand": true, "brand_summary": "Google menulis 14 harga perawatan Ultima dan mengutip Traveloka, tiket.com, Tokopedia, Scribd, dan Instagram untuk harga-harga itu. Sepuluh berbeda dari teks di situs Ultima; enam di antaranya berupa kisaran yang memuat harga situs atau berujung di harga itu.", "google": {"status": "mentioned", "named": [], "rec": [], "sources": [{"title": "Daftar Harga Perawatan Ultima Clinic | PDF", "url": "", "domain": "id.scribd.com"}, {"title": "Ultima Clinic | Treatment Jutaan Jadi Cuma 100RB-an Bisa Bikin Kulit ...", "url": "", "domain": "instagram.com"}, {"title": "Tiket Ultima Clinic Tanjung Barat Harga Promo", "url": "", "domain": "tiket.com"}, {"title": "Beli Tiket Ultima Clinic - Kemang - Harga Promo 2026 di Traveloka", "url": "", "domain": "traveloka.com"}, {"title": "Beli Tiket Ultima Clinic - Pondok Bambu - Harga Promo 2026 di Traveloka", "url": "", "domain": "traveloka.com"}, {"title": "Promo ULTIMA Acne Laser Facial - Tokopedia", "url": "", "domain": "tokopedia.com"}, {"title": "Ultima Clinic | Kapan Lagi DNA Salmon Cuma 1 JUTAAN? ...", "url": "", "domain": "instagram.com"}, {"title": "Ultima Clinic - Klinik Kecantikan Terdek function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(n) { return Number(n).toLocaleString("id-ID"); }
function dot(status, extra = "") { return `<span class="dot ${status} ${extra}" aria-hidden="true"></span>`; }
function refs(list) { return (list || []).map(n => `<button class="ref" data-q="${n}">P${n}</button>`).join(" "); }
function volText(x) { return x.volume ? `±${fmt(x.volume)} pencarian/bulan` : x.ai_mentions ? `±${fmt(x.ai_mentions)} sebutan di asisten AI/bulan` : ""; }
function label(a) { return (a && a.label) || STATUS[(a && a.status) || "notasked"]; }
function namedIn(a) { return a && (a.status === "mentioned" || a.status === "recommended"); }

/* ---------- counts, computed from the answers (code, not the writer) ---------- */
function stats(src) {
  const qs = QS.map(q => q[src]).filter(a => a && a.status !== "notasked");
  const done = qs.filter(a => a.status !== "failed");
  const shown = done.filter(a => a.status !== "noaio");
  return {
    asked: qs.length, done: done.length, shown: shown.length,
    noaio: done.length - shown.length, failed: qs.length - done.length,
    named: shown.filter(namedIn).length,
    rec: shown.filter(a => a.status === "recommended").length,
    cited: shown.filter(a => a.status === "cited").length,
  };
}
function businessCounts(src) {
  const m = {};
  QS.forEach(q => {
    const a = q[src];
    if (!a || a.status === "notasked" || a.status === "failed" || a.status === "noaio") return;
    new Set(a.named || []).forEach(n => { m[n] = (m[n] || 0) + 1; });
  });
  return m;
}
function avgNamed(src) {
  const per = QS.map(q => q[src]).filter(a => a && !["notasked", "failed", "noaio"].includes(a.status))
    .map(a => new Set([...(a.named || []), ...(namedIn(a) ? [CLINIC] : [])]).size).filter(n => n > 0);
  if (!per.length) return null;
  return { avg: per.reduce((x, y) => x + y, 0) / per.length, n: per.length };
}

/* ---------- tiny Markdown for saved answers ---------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/\[\[(\d+)\]\]\((https?:[^)\s]+)\)/g, (m, n, u) => `<sup class="cite"><a href="${u}" target="_blank" rel="noreferrer noopener">${n}</a></sup>`);
  s = s.replace(/\[\[(\d+)\]\]/g, (m, n) => `<sup class="cite">${n}</sup>`);
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noreferrer noopener">${t}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  return s;
}
function md(text) {
  const lines = String(text || "").split("\n");
  let out = [], list = null, table = null;
  const flush = () => {
    if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.t}>`); list = null; }
    if (table) {
      const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      const cells = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
      const [h, ...b] = rows;
      out.push(`<div class="tw"><table><thead><tr>${cells(h).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${b.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      table = null;
    }
  };
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^\s*\|.*\|\s*$/.test(l)) { if (list) flush(); (table = table || []).push(l); continue; }
    if (table) flush();
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) { if (!list || list.t !== "ul") { flush(); list = { t: "ul", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { if (!list || list.t !== "ol") { flush(); list = { t: "ol", items: [] }; } list.items.push(m[1]); continue; }
    flush();
    if (!l.trim()) continue;
    if ((m = l.match(/^#{1,6}\s+(.*)$/))) { out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    out.push(`<p>${inline(l)}</p>`);
  }
  flush();
  return out.join("");
}
function highlight(html, diffs) {
  const names = [...new Set([...(D.businesses || []).flatMap(b => [b.name, ...(b.aliases || [])])])]
    .filter(Boolean).sort((a, b) => b.length - a.length);
  const youNames = [CLINIC, ...(D.meta.aliases || [])].sort((a, b) => b.length - a.length);
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // Only touch text outside tags.
  return html.replace(/>([^<]+)</g, (m, txt) => {
    let t = txt;
    (diffs || []).forEach(dq => { const e = esc(dq); if (e && t.includes(e)) t = t.split(e).join(`\u0001${e}\u0002`); });
    youNames.forEach(n => { t = t.replace(new RegExp(`(^|[^\\w])(${reEsc(esc(n))})(?![\\w])`, "g"), "$1\u0003$2\u0004"); });
    names.forEach(n => { if (youNames.includes(n)) return; t = t.replace(new RegExp(`(^|[^\\w\u0003])(${reEsc(esc(n))})(?![\\w])`, "g"), "$1\u0005$2\u0006"); });
    t = t.replace(/\u0001/g, '<mark class="diff">').replace(/\u0002/g, "</mark>")
         .replace(/\u0003/g, '<mark class="you">').replace(/\u0004/g, "</mark>")
         .replace(/\u0005/g, '<mark class="name">').replace(/\u0006/g, "</mark>");
    return `>${t}<`;
  });
}
function answerHTML(q, src) {
  const a = q[src];
  if (!a || a.status === "notasked") return `<p class="small">Pertanyaan ini tidak ditanyakan ke ${SRC[src]} dalam data ini.</p>`;
  if (a.status === "noaio") return `<div class="status-line">${dot("noaio")}<span class="pill">${STATUS.noaio}</span></div><p class="small">Google tidak menampilkan AI Overview saat pertanyaan ini diperiksa.</p>`;
  if (a.status === "failed") return `<div class="status-line">${dot("failed")}<span class="pill">${esc(label(a))}</span></div><p class="small">${esc(a.note || "Pemeriksaan ini tidak berhasil. Tim Nuave membantu menjalankannya lagi.")}</p>`;
  const diffs = (D.facts || []).filter(f => f.n === q.n && f.source === src && f.verdict === "berbeda").map(f => f.quote);
  const chips = (a.sources || []).map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noreferrer noopener" title="${esc(s.title || "")}">${esc(s.domain)}</a>` : `<span title="${esc(s.title || "")}">${esc(s.domain)}</span>`).join("");
  return `<div class="status-line">${dot(a.status)}<span class="pill ${a.status === "recommended" || a.status === "mentioned" ? "acc" : ""}">${STATUS[a.status]}</span>${a.time ? `<span class="small">${esc(a.time)}</span>` : ""}</div>
    <div class="answer">${highlight(md(a.answer), diffs)}</div>
    ${chips ? `<div><div class="small" style="margin-bottom:6px">Sumber yang dikutip</div><div class="srcchips">${chips}</div></div>` : ""}`;
}

function compare() {
  const row = (src, den, label) => {
    const bc = businessCounts(src);
    const others = Object.entries(bc).filter(([n]) => n !== CLINIC).sort((a, b) => b[1] - a[1]);
    const youN = stats(src).named;
    if (!den) return "";
    const top = others[0];
    const bar = (name, n, you) => `<div class="bar ${you ? "you" : ""}"><span class="bar-name">${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${(n / den) * 100}%"></div></div><span class="bar-label tnum">${n} dari ${den}</span></div>`;
    return `<div class="cmp-row"><div class="cmp-src">${SRC[src]}<small>${label}</small></div><div class="bars">${top ? bar(`${top[0]} (paling sering disebut)`, top[1], false) : ""}${bar(CLINIC, youN, true)}</div></div>`;
  };
  const c = stats("chatgpt"), g = stats("google");
  const ac = avgNamed("chatgpt"), ag = avgNamed("google");
  const avg = [ac && `jawaban ChatGPT yang menyebut bisnis rata-rata menyebut ${ac.avg.toFixed(1).replace(".", ",")} nama (${ac.n} jawaban)`, ag && `ringkasan Google rata-rata ${ag.avg.toFixed(1).replace(".", ",")} nama (${ag.n} ringkasan)`].filter(Boolean).join("; ");

}

function facts() {
  const F = D.facts || [];

  const n = { berbeda: 0, sesuai: 0, tidak_bisa_dicek: 0, tanpa_penilaian: 0 };
  F.forEach(f => n[f.verdict]++);
  const V = { berbeda: ["Berbeda", "bad"], sesuai: ["Sesuai", "good"], tidak_bisa_dicek: ["Tidak bisa dicek", ""], tanpa_penilaian: ["Tanpa penilaian", "warn"] };
  const sum = `<div class="fact-sum"><span class="pill">${F.length} klaim diperiksa</span>${n.berbeda ? `<span class="pill bad">${n.berbeda} berbeda</span>` : ""}${n.sesuai ? `<span class="pill good">${n.sesuai} sesuai</span>` : ""}${n.tidak_bisa_dicek ? `<span class="pill">${n.tidak_bisa_dicek} tidak bisa dicek</span>` : ""}${n.tanpa_penilaian ? `<span class="pill warn">${n.tanpa_penilaian} tanpa penilaian</span>` : ""}</div>`;
  const shownF = F.some(f => "show" in f) ? F.filter(f => f.show) : F;
  const subset = shownF.length < F.length ? `<p class="small">Ditampilkan ${shownF.length} dari ${F.length} klaim. Semuanya ada di Lembar Kerja, tab Cek Fakta.</p>` : "";
  const body = F.length ? sum + subset + shownF.map(f => {
    const [vl, vc] = V[f.verdict];
    return `<article class="fact"><div class="fact-top"><span>${SRC[f.source]} · <button class="ref" data-q="${f.n}" data-src="${f.source}">P${f.n}</button> · ${esc(f.topic)}</span><span class="pill ${vc}">${vl}</span></div>
      <div class="fact-said ${f.verdict === "sesuai" ? "same" : f.verdict === "berbeda" ? "" : "none"}"><div class="small">Kata ${SRC[f.source]}</div><q>${esc(f.quote)}</q></div>
      ${f.ref_text ? `<div class="fact-ref"><b>${esc(f.ref_label)}:</b> ${esc(f.ref_text)}${f.ref_url ? ` <a href="${esc(f.ref_url)}" target="_blank" rel="noreferrer noopener" class="small">${esc(f.ref_site || "halaman")}</a>` : ""}</div>` : ""}

    </article>`;
  }).join("") : `<p class="lede">${esc(D.facts_empty)}</p>`;
  return band("cek-fakta", "Cek fakta: apa kata AI tentang " + SHORT, D.facts_lede, body);

function competitors() {
  // Mentions per source for every business; "recommended" only for the clinic and only in ChatGPT, the one
  // recommendation count the product saves (counts.chatgpt.recommended). Google's is a per-answer reading.
  const cc = businessCounts("chatgpt"), gc = businessCounts("google");
  const youC = stats("chatgpt").named, youG = stats("google").named;
  const youRecC = stats("chatgpt").rec;
  const den = { c: stats("chatgpt").done, g: stats("google").shown };
  const all = (D.businesses || []).map(b => {
    const you = b.name === CLINIC;
    const c = you ? youC : (cc[b.name] || 0), g = you ? youG : (gc[b.name] || 0);
    return { ...b, you, c, g, rC: you ? youRecC : 0 };
  }).filter(b => b.c + b.g > 0)
    // The web report's order (report-v2-data.ts sortRows): both sources' mentions together, the clinic
    // first on a tie, then ChatGPT cards, then the name. The sum only orders the rows; it is never shown.
    .sort((a, b) => (b.c + b.g) - (a.c + a.g) || (a.you ? -1 : b.you ? 1 : 0) || (b.cards || 0) - (a.cards || 0) || a.name.localeCompare(b.name));
  const full = all.filter(b => b.full || b.you).slice(0, 6);
  const rest = all.filter(b => !full.includes(b));
  const initials = n => n.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const rows = full.map(b => `<div class="comp ${b.you ? "you" : ""}"><div class="logo-i">${esc(initials(b.name))}</div>
    <div><div class="comp-name">${esc(b.name)}${b.you ? '<span class="pill acc">Klinik Anda</span>' : ""}</div><div class="comp-site">${b.domain ? esc(b.domain) : "situs tidak tercatat"}${b.rating ? ` · ${esc(b.rating)}` : ""}</div></div>
    <div class="comp-count"><div class="cc-row"><span class="cc"><small>ChatGPT</small><b class="tnum">${b.c}</b><small>dari ${den.c}</small></span><span class="cc"><small>Google</small><b class="tnum">${b.g}</b><small>dari ${den.g}</small></span></div></div>
    ${b.you && b.rC ? `<div class="comp-rec">Direkomendasikan di ChatGPT: ${b.rC} dari ${den.c} jawaban</div>` : ""}
    ${b.why ? `<div class="comp-why"><em>Menurut jawaban AI:</em> ${esc(b.why)}</div>` : ""}</div>`).join("");
  const chips = rest.length ? `<div class="chips"><span class="small" style="width:100%">${rest.length} bisnis lain disebut lebih jarang:</span>${rest.map(b => `<span class="chip">${esc(b.name)} · ChatGPT ${b.c} · Google ${b.g}</span>`).join("")}</div>` : "";
  const takes = (D.takeaways || []).length ? `<div class="cards3">${D.takeaways.map(t => `<div class="take"><b>${esc(t.title)}</b><p>${esc(t.text)}</p></div>`).join("")}</div>` : "";
  return band("pesaing", "Peta Pesaing", D.comp_lede, `<div class="comp-list">${rows}${chips}</div>${takes}`, "", true);
}

    return `<article class="rec"><div class="rec-n">${i + 1}</div><h3>${esc(r.title)}</h3><p>${esc(r.text)} ${refs(r.refs)}</p>
      <div class="tags">${p.who ? `<span class="tag"><b>Siapa:</b> ${esc(p.who)}</span>` : ""}${p.effort ? `<span class="tag"><b>Waktu kerja:</b> ${esc(p.effort)}</span>` : ""}${p.check ? `<span class="tag"><b>Selesai jika:</b> ${esc(p.check)}</span>` : ""}</div>
      ${p.line ? `<p class="basis">Dasar, ${esc(p.source)}: ${esc(p.line)}${(p.urls || (p.url ? [p.url] : [])).map((u, i, arr) => ` <a href="${esc(u)}" target="_blank" rel="noreferrer noopener">Sumber${arr.length > 1 ? " " + (i + 1) : ""}</a>`).join("")}</p>` : ""}</article>`;
  }).join("")}</div>`, "wash", true);
}
function closing() {
  const c = D.closing, cs = stats("chatgpt"), gs = stats("google");
  const nb = (D.facts || []).filter(f => f.verdict === "berbeda").length;
  const wf = (D.webcheck || []).filter(w => ["gagal", "sebagian", "tidakcocok"].includes(w.result)).length;
  const plan = c.plan.map(s => `<div class="step"><span class="wk">${esc(s.weeks)}</span><b>${esc(s.title)}</b><p>${esc(s.text)}</p>${s.decision ? `<span class="dec">Keputusan Anda: ${esc(s.decision)}</span>` : ""}</div>`).join("");
  return band("penutup", "Penutup", "", `<p class="closing-text">${esc(c.text)}</p><div class="plan">${plan}</div>
    <div class="inkcards"><div class="inkcard"><h3>Titik awal</h3><ul class="tnum">
      <li>ChatGPT: <b>${cs.named} dari ${cs.done}</b> jawaban menyebut ${esc(SHORT)}</li>
      <li>Google AI Overview: <b>${gs.named} dari ${gs.shown}</b> ringkasan menyebut ${esc(SHORT)}</li>
      ${(D.facts || []).length ? `<li>Cek fakta: <b>${nb} dari ${D.facts.length}</b> klaim yang diperiksa berbeda dari situs ${esc(SHORT)}</li>` : ""}
      ${(D.webcheck || []).length ? `<li>Untuk tim web: <b>${wf} dari ${D.webcheck.filter(w => w.result !== "f3").length}</b> pemeriksaan teknis yang dinilai perlu diperbaiki</li>` : ""}
    </ul><p>Angka ini tersimpan di Lembar Kerja, tab Titik Awal, untuk dibandingkan nanti.</p></div>
    <div class="inkcard"><h3>Audit ulang setelah 8 minggu</h3><p>${esc(c.recheck)}</p></div></div>`, "ink", true);
}
function webcheck() {
  const W = D.webcheck || []; if (!W.length) return "";
  const R = { lulus: ["Lulus", "good"], gagal: ["Gagal", "bad"], sebagian: ["Sebagian", "warn"], tidakcocok: ["Tidak cocok", "warn"], indikasi: ["Indikasi", "warn"], netral: ["Catatan", ""], tidakada: ["Tidak ada", ""], f3: ["Butuh F-3", "acc"] };
  return `<details class="fold" id="tim-web"><summary><div><h3>Untuk tim web Anda</h3><small>${esc(D.webcheck_sub || "")}</small></div>${ICON.chev}</summary><div class="fold-b">
    ${W.map(w => { const [l, c] = R[w.result] || [w.result, ""]; return `<div class="wc-row"><b>${esc(w.row)}</b><span class="pill ${c}">${l}</span><div class="detail">${w.detail}</div>${w.fix ? `<div class="fix"><b>Cara memperbaiki:</b> ${esc(w.fix)}</div>` : ""}</div>`; }).join("")}
    <p class="small">${esc(D.webcheck_note || "")}</p></div></details>`;
}
function kit() {
  const K = D.kit || []; if (!K.length) return "";
  return `<details class="fold" id="bahan"><summary><div><h3>Bahan siap pakai</h3><small>${esc(D.kit_sub || "")}</small></div>${ICON.chev}</summary><div class="fold-b">
    ${K.map((k, i) => `<div class="kit-item ${k.locked ? "locked" : ""}"><h4><span>${esc(k.title)}</span>${k.locked ? '<span class="pill">Setelah tinjauan hukum</span>' : `<button class="btn no-print" data-copy="${i}">Salin teks</button>`}</h4>${k.for ? `<p class="small">${esc(k.for)}</p>` : ""}<div class="kit-text" id="kit-${i}">${esc(k.text)}</div></div>`).join("")}
  </div></details>`;
}
function worksheet() {
  const w = D.worksheet;
  return `<div class="ws"><div class="eyebrow">Lembar Kerja</div><h3 style="font-size:20px;font-weight:600">${esc(w.title)}</h3><p>${esc(w.text)}</p>
    <div class="ws-tabs">${w.tabs.map(t => `<span class="ws-tab">${esc(t)}</span>`).join("")}</div>
    <div><button class="btn primary no-print" data-file="xlsx">Unduh Lembar Kerja (Excel)</button></div></div>`;
}
function answers() {
  const head = `<div class="arow"><span>#</span><span>Pertanyaan</span><span class="d" title="ChatGPT">${ICON.chatgpt}</span><span class="d" title="Google AI Overview">${ICON.google}</span></div>`;
  const rows = D.questions.map(q => `<div class="arow" data-q="${q.n}" tabindex="0" role="button" aria-label="Buka pertanyaan ${q.n}"><span class="num">${q.n}</span><span class="q">${esc(q.q)}<small>${esc(q.topic)}${volText(q) ? ` · ${volText(q)}` : ""}${q.brand ? " · menyebut nama klinik, tidak dihitung" : ""}</small></span>
    <span class="d" title="ChatGPT · ${STATUS[(q.chatgpt || {}).status || "notasked"]}">${dot((q.chatgpt || {}).status || "notasked")}</span><span class="d" title="Google AI Overview · ${STATUS[(q.google || {}).status || "notasked"]}">${dot((q.google || {}).status || "notasked")}</span></div>`).join("");
  return band("jawaban", "Jawaban AI", D.answers_lede, `<div class="atable">${head}${rows}</div><div class="notes">${(D.answer_notes || []).map(n => `<span>· ${esc(n)}</span>`).join("")}</div>`, "grey", true);
}
function method() {
  return `<details class="fold method" id="cara-membaca"><summary><div><h3>Cara membaca angka ini</h3><small>Apa yang ditanyakan, kapan, dan apa yang tidak bisa ditunjukkan</small></div>${ICON.chev}</summary><div class="fold-b"><ul>${D.method.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div></details>`;
}
function appendix() {
  const items = D.questions.flatMap(q => ["chatgpt", "google"].filter(s => q[s] && q[s].status !== "notasked").map(s => `<div class="ap-item"><div class="small">PERTANYAAN ${q.n} · ${SRC[s].toUpperCase()}</div><div class="bubble">${esc(q.q)}</div>${answerHTML(q, s)}</div>`)).join("");
  return `<section class="band print-only pb"><div class="wrap"><h2>Lampiran: jawaban lengkap</h2>${items}</div></section>`;
}
function footer() {
  return `<footer><div class="wrap"><span>Nuave · Laporan Visibilitas AI · ${esc(CLINIC)}</span><span>${esc(D.meta.footer)}</span></div></footer>`;
}

function render() {
  const tocItems = [["temuan", "Temuan Utama"], ...((D.facts || []).length || D.facts_empty ? [["cek-fakta", "Cek fakta"]] : []), ["pesaing", "Peta Pesaing"],
    ...(D.description ? [["gambaran", "Gambaran AI"]] : []), ...(D.pages_grid ? [["halaman", "Halaman pesaing"]] : []), ["celah", "Celah Topik"],
    ...(D.sitemap ? [["situs-ai", "Situs yang dibaca AI"]] : []), ["rekomendasi", "Rekomendasi"], ["penutup", "Penutup"], ["lainnya", "Tim web, bahan, lembar kerja"], ["jawaban", "Jawaban AI"]];
  document.getElementById("app").innerHTML = header() + toc(tocItems) + findings() + facts() + competitors() + description() + pagesGrid() + topics() + sourceMap() + recs() + closing()
    + `<section class="band" id="lainnya"><div class="wrap"><h2>Untuk dikerjakan</h2><p class="lede">${esc(D.extras_lede)}</p>${webcheck()}${kit()}${worksheet()}</div></section>`
    + answers() + `<section class="band grey" style="border-top:0"><div class="wrap" style="padding-top:0">${method()}</div></section>` + appendix() + footer();
}
render();

/* ---------- side panel ---------- */
const panel = document.getElementById("panel"), scrim = document.getElementById("scrim");
let cur = { n: 1, src: "chatgpt" }, lastFocus = null;
function firstSrc(q) { return ["chatgpt", "google"].find(s => q[s] && q[s].status !== "notasked") || "chatgpt"; }
function show(n, src) {
  const q = D.questions.find(x => x.n === n); if (!q) return;
  src = src && q[src] && q[src].status !== "notasked" ? src : firstSrc(q);
  cur = { n, src };
  document.getElementById("p-title").textContent = `Pertanyaan ${n} dari ${D.questions.length}`;
  document.getElementById("p-tabs").innerHTML = ["chatgpt", "google"].map(s => `<button class="p-tab" role="tab" aria-selected="${s === src}" data-tab="${s}" ${!q[s] || q[s].status === "notasked" ? "disabled" : ""}>${SRC[s]}</button>`).join("");
  document.getElementById("p-body").innerHTML = `<div class="small">${esc(q.topic)}${volText(q) ? ` · ${volText(q)}` : ""}</div><div class="bubble">${esc(q.q)}</div>${answerHTML(q, src)}`;
  document.getElementById("p-body").scrollTop = 0;
}
function open(n, src) { lastFocus = document.activeElement; show(n, src); panel.classList.add("on"); scrim.classList.add("on"); panel.setAttribute("aria-hidden", "false"); document.getElementById("p-close").focus(); }
function close() { panel.classList.remove("on"); scrim.classList.remove("on"); panel.setAttribute("aria-hidden", "true"); if (lastFocus) lastFocus.focus(); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-q]");
  if (t && !t.closest(".panel")) { open(Number(t.dataset.q), t.dataset.src); return; }
  const tab = e.target.closest("[data-tab]"); if (tab) { show(cur.n, tab.dataset.tab); return; }
  const f = e.target.closest("[data-file]");
  if (f) { const note = document.getElementById("file-note"); note.hidden = false; note.textContent = D.meta.file_note; note.scrollIntoView({ block: "nearest" }); return; }
  const c = e.target.closest("[data-copy]");
  if (c) { const txt = D.kit[Number(c.dataset.copy)].text; const done = () => { c.textContent = "Tersalin"; setTimeout(() => (c.textContent = "Salin teks"), 1600); };
    try { navigator.clipboard.writeText(txt).then(done, () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("kit-" + c.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }); } catch (_) {} }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && panel.classList.contains("on")) close();
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("arow") && e.target.dataset.q) open(Number(e.target.dataset.q));
});
scrim.addEventListener("click", close);
document.getElementById("p-close").addEventListener("click", close);
document.getElementById("p-prev").addEventListener("click", () => show(cur.n > 1 ? cur.n - 1 : D.questions.length, cur.src));
document.getElementById("p-next").addEventListener("click", () => show(cur.n < D.questions.length ? cur.n + 1 : 1, cur.src));
window.__expandForPrint = () => document.querySelectorAll("details").forEach(d => d.setAttribute("open", ""));
</script>

</body></html>

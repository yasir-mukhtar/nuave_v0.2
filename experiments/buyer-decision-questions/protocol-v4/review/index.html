<!doctype html>
<meta charset="utf-8"><title>Nuave protocol-v4 clean Stage 1 blind review</title>
<style>
body{font:15px system-ui,sans-serif;max-width:1100px;margin:24px auto;color:#17202a;background:#fafaf8}button,select{padding:7px;margin:3px;border:1px solid #bbb;border-radius:5px;background:white}button.sel{background:#d9f2df}section{background:white;border:1px solid #ddd;border-radius:10px;padding:18px;margin:18px 0}.q{border-top:1px solid #eee;padding:10px 0}.qtext{font-size:16px}.meta{color:#666;font-size:12px}.warn{background:#fff1d6;padding:10px;border-radius:6px}.hidden{display:none}.packgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.packgrid{grid-template-columns:1fr}}
</style>
<h1>Nuave buyer-question review</h1><p><b>Blind first pass.</b> Review every question as written. Approach identity, plans, validation, and AI judgments remain hidden until both packs and the preference are saved.</p><div id="app"></div><script src="data.js"></script><script>
(()=>{const D=window.EXPERIMENT_DATA,KEY='nuave.protocol-v4.clean-stage1.review.v1',app=document.querySelector('#app');let state=JSON.parse(localStorage.getItem(KEY)||'null')||{fixtures:{}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hash=s=>{let n=0;for(const c of s)n=(n*31+c.charCodeAt(0))>>>0;return n};const shuffle=(seed,n)=>{let a=Array.from({length:n},(_,i)=>i),x=hash(seed);for(let i=n-1;i;i--){x=(x*1664525+1013904223)>>>0;let j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const result=(f,arm)=>D.results.find(r=>r.fixture_id===f.fixture_id&&r.arm===arm);const fs=f=>state.fixtures[f.fixture_id]||(state.fixtures[f.fixture_id]={});const ps=(f,arm)=>{let x=fs(f)[arm];if(!x){x={marks:{},pass2:{},revealed:false,order:shuffle(`${f.fixture_id}:${arm}`,10)};fs(f)[arm]=x}return x};const complete=x=>Object.keys(x.marks).length===10&&Object.values(x.marks).every(v=>v&&v.mark);function render(){app.innerHTML='<div class="warn">Stage 1 bundle: '+D.fixtures.length+' fixtures, '+D.results.length+' attempted pack records. Founder marks and preferences are blank.</div>';for(const f of D.fixtures){const a=result(f,'S'),p=result(f,'P'),x=fs(f);if(!a||!p){app.innerHTML+='<section>Missing pack for '+esc(f.fixture_id)+'</section>';continue}const sa=ps(f,'S'),sp=ps(f,'P'),order=fs(f);if(!order.labels){order.labels=hash(f.fixture_id)%2?{S:'Paket 2',P:'Paket 1'}:{S:'Paket 1',P:'Paket 2'};save()}app.innerHTML+=`<section><h2>${esc(f.fixture_id)}</h2><p>${esc(f.category)} · ${esc(f.brief_richness)} brief</p><pre>${esc(JSON.stringify(f.business,null,2))}</pre><div class="packgrid">${packHtml(f,a,sa,'S',order.labels.S)}${packHtml(f,p,sp,'P',order.labels.P)}</div><div><b>Overall preference</b><select data-pref="${esc(f.fixture_id)}"><option value="">— choose after marking both —</option><option value="S" ${x.preference==='S'?'selected':''}>${order.labels.S} is better</option><option value="P" ${x.preference==='P'?'selected':''}>${order.labels.P} is better</option><option value="tie" ${x.preference==='tie'?'selected':''}>Tie</option></select><button data-reveal="${esc(f.fixture_id)}" ${!(complete(sa)&&complete(sp)&&x.preference)?'disabled':''}>Reveal semantic metadata</button></div></section>`}app.innerHTML+='<p><button id="export">Export review JSON</button> <input id="import" type="file" accept="application/json"></p>';bind();}
function packHtml(f,r,s,arm,label){let qs=r.calls?.find(c=>c.label==='one-shot'||c.label==='realizer')?.parsed_output?.questions||[];return `<div><h3>${label}</h3>${s.order.map((i)=>{const q=qs[i],m=s.marks[String(i)]||{};return `<div class="q"><div class="qtext">#${i+1} ${esc(q?.text||'[failed or unavailable]')}</div><div><button data-mark="${f.fixture_id}|${arm}|${i}" class="${m.mark==='keep'?'sel':''}">Keep</button><button data-mark="${f.fixture_id}|${arm}|${i}" class="${m.mark==='light'?'sel':''}">Light</button><button data-mark="${f.fixture_id}|${arm}|${i}" class="${m.mark==='replace'?'sel':''}">Replace</button></div></div>`}).join('')}${s.revealed?`<div class="meta"><b>Technical review</b><pre>${esc(JSON.stringify({status:r.status,validation_issues:r.validation_issues,plan:r.raw_plan||null},null,2))}</pre><select data-pass2="${f.fixture_id}|${arm}"><option value="">— semantic review —</option><option value="ok">OK</option><option value="issue">Issue</option></select></div>`:''}</div>`}
function bind(){document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{const [fid,arm,i]=b.dataset.mark.split('|'),f=D.fixtures.find(x=>x.fixture_id===fid),r=result(f,arm),s=ps(f,arm),q=(r.calls?.find(c=>c.label==='one-shot'||c.label==='realizer')?.parsed_output?.questions||[])[+i];const old=s.marks[i]||{};s.marks[i]={...old,mark:b.textContent.toLowerCase(),run_id:r.run_id,question_index:+i+1,question_text:old.question_text===undefined?(q?.text||''):old.question_text};save();render()});document.querySelectorAll('[data-pref]').forEach(e=>e.onchange=()=>{const f=D.fixtures.find(x=>x.fixture_id===e.dataset.pref),x=fs(f);x.preference=e.value||null;x.preference_binding={S:result(f,'S').run_id,P:result(f,'P').run_id};save();render()});document.querySelectorAll('[data-reveal]').forEach(e=>e.onclick=()=>{const f=D.fixtures.find(x=>x.fixture_id===e.dataset.reveal);ps(f,'S').revealed=ps(f,'P').revealed=true;save();render()});document.querySelectorAll('[data-pass2]').forEach(e=>e.onchange=()=>{const [fid,arm]=e.dataset.pass2.split('|');const r=result(D.fixtures.find(x=>x.fixture_id===fid),arm);const s=ps(D.fixtures.find(x=>x.fixture_id===fid),arm);s.pass2={status:e.value,reviewed_run_id:r.run_id};save()});document.querySelector('#export').onclick=()=>{const out={schema:'nuave-protocol-v4-review-export-v1',exported_at:new Date().toISOString(),reviewer:{type:'founder',name:'Founder'},fixtures:state.fixtures};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='nuave-protocol-v4-review.json';a.click()};document.querySelector('#import').onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const x=JSON.parse(rd.result);if(x.schema!=='nuave-protocol-v4-review-export-v1')return alert('Invalid review export');state.fixtures=x.fixtures||{};save();render()};rd.readAsText(file)}}render()})()
</script>
